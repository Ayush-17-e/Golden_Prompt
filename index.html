    host.textContent = '';
    const res = Repository.query(this.q);

    // Filter bar
    const bar = UI.card({class:'mb-4', body:[
      Utils.el('div', {class:'grid g-4'}, [
        UI.field({label: Utils.t('search'), id:'h-search', placeholder:'Match id, difficulty, mode…',
          value: this.q.search,
          oninput: Utils.debounce(e => { Pages.history.q.search = Utils.sanitize(e.target.value, 40);
            Pages.history.q.page = 1; Pages.history.paint(); }, CONFIG.ui.searchDebounceMs)}),
        UI.field({label:'Result', type:'select', id:'h-result', value:this.q.result,
          options:[{value:'all',label:Utils.t('all')},{value:'win',label:Utils.t('win')},
                   {value:'loss',label:Utils.t('loss')},{value:'draw',label:Utils.t('draw')}],
          onchange: e => { Pages.history.q.result = e.target.value; Pages.history.q.page=1; Pages.history.paint(); }}),
        UI.field({label: Utils.t('difficulty'), type:'select', id:'h-diff', value:this.q.difficulty,
          options:[{value:'all',label:Utils.t('all')}].concat(
            CONFIG.game.difficulties.map(d => ({value:d,label:Utils.t(d)}))),
          onchange: e => { Pages.history.q.difficulty = e.target.value; Pages.history.q.page=1; Pages.history.paint(); }}),
        UI.field({label: Utils.t('mode'), type:'select', id:'h-mode', value:this.q.mode,
          options:[{value:'all',label:Utils.t('all')}].concat(
            CONFIG.game.modes.map(m => ({value:m,label:Utils.t(m)}))),
          onchange: e => { Pages.history.q.mode = e.target.value; Pages.history.q.page=1; Pages.history.paint(); }})
      ]),
      Utils.el('div', {class:'row mt-4'}, [
        Utils.el('button', {class:'btn btn-sm', onclick:() => {
          Pages.history.q = {search:'', result:'all', difficulty:'all', mode:'all',
            sort:'createdAt', dir:'desc', page:1};
          Pages.history.paint();
        }, icon:'x', text:Utils.t('clear')}),
        Utils.el('button', {class:'btn btn-sm', onclick:() => Pages.history.savePreset(),
          icon:'download', text:'Save preset'}),
        Utils.el('button', {class:'btn btn-sm', onclick:() => Pages.history.loadPreset(),
          icon:'file', text:'Load preset'}),
        Utils.el('span', {class:'t-xs dim', style:'margin-left:auto',
          text: Utils.num(res.total) + ' of ' + Utils.num(State.matches.length) + ' matches'})
      ]),
      Pages.history.chips()
    ]});
    host.appendChild(bar);

    // Bulk actions
    if (this.selected.size){
      host.appendChild(Utils.el('div', {class:'banner'}, [
        Utils.el('span', {text: this.selected.size + ' selected'}),
        Utils.el('button', {class:'btn btn-sm btn-danger', style:'margin-left:auto',
          onclick:() => Pages.history.bulkDelete(), icon:'trash', text:'Delete selected'}),
        Utils.el('button', {class:'btn btn-sm', onclick:() => { Pages.history.selected.clear();
          Pages.history.paint(); }, text:'Clear selection'})
      ]));
    }

    const cols = [
      {key:'sel', label:'', sortable:false, render: row => {
        const cb = Utils.el('input', {type:'checkbox', 'aria-label':'Select ' + row.id,
          checked: this.selected.has(row.id)});
        cb.addEventListener('click', e => e.stopPropagation());
        cb.addEventListener('change', () => {
          cb.checked ? this.selected.add(row.id) : this.selected.delete(row.id);
          this.paint();
        });
        return cb;
      }},
      {key:'id', label:'Match'},
      {key:'createdAt', label:'Date', render: r => Utils.date(r.createdAt, true)},
      {key:'result', label:'Result', render: r => UI.badge(r.result)},
      {key:'playerScore', label:'Score', render: r => r.playerScore + ' – ' + r.aiScore},
      {key:'rounds', label:'Rounds'},
      {key:'difficulty', label: Utils.t('difficulty'), render: r => Utils.titleCase(r.difficulty)},
      {key:'mode', label: Utils.t('mode'), render: r => Utils.titleCase(r.mode)},
      {key:'accuracy', label:'AI read', render: r => Utils.pct(r.accuracy)},
      {key:'act', label:'', sortable:false, render: r => {
        const b = Utils.el('button', {class:'btn btn-sm', text:'Details'});
        b.addEventListener('click', e => { e.stopPropagation(); Pages.history.detail(r); });
        return b;
      }}
    ];

    host.appendChild(UI.table({
      columns: cols, rows: res.rows, total: res.total, pages: res.pages, page: res.page,
      sort: this.q.sort, dir: this.q.dir,
      emptyMessage:'No matches match these filters.',
      onSort: key => {
        if (this.q.sort === key) this.q.dir = this.q.dir === 'asc' ? 'desc' : 'asc';
        else { this.q.sort = key; this.q.dir = 'desc'; }
        this.paint();
      },
      onPage: p => { this.q.page = p; this.paint(); AudioEngine.play('click'); },
      onRowClick: r => this.detail(r),
      highlight: r => !r.synthetic
    }));
  },

  chips(){
    const wrap = Utils.el('div', {class:'row mt-4', style:'gap:.4rem'});
    const active = [];
    if (this.q.search) active.push(['search', 'Search: ' + this.q.search]);
    if (this.q.result !== 'all') active.push(['result', 'Result: ' + this.q.result]);
    if (this.q.difficulty !== 'all') active.push(['difficulty', 'Difficulty: ' + this.q.difficulty]);
    if (this.q.mode !== 'all') active.push(['mode', 'Mode: ' + this.q.mode]);
    if (!active.length) return wrap;
    active.forEach(([key, label]) => {
      wrap.appendChild(Utils.el('span', {class:'chip'}, [
        Utils.el('span', {text: label}),
        Utils.el('button', {'aria-label':'Remove filter ' + label, onclick:() => {
          this.q[key] = key === 'search' ? '' : 'all'; this.q.page = 1; this.paint();
        }}, [Icons.svg('x')])
      ]));
    });
    return wrap;
  },

  detail(match){
    const rounds = Repository.roundsOf(match.id);
    const body = Utils.el('div', {class:'stack'}, [
      Utils.el('div', {class:'grid g-3'}, [
        ['Result', Utils.titleCase(match.result)], ['Score', match.playerScore + ' – ' + match.aiScore],
        ['Difficulty', Utils.titleCase(match.difficulty)], ['Mode', Utils.titleCase(match.mode)],
        ['Rounds', String(match.rounds)], ['AI read-rate', Utils.pct(match.accuracy)],
        ['Duration', Math.round((match.durationMs||0)/1000) + 's'],
        ['Played', Utils.date(match.createdAt, true)]
      ].map(([k,v]) => Utils.el('div', {}, [
        Utils.el('div', {class:'kpi-label', text:k}),
        Utils.el('div', {class:'t-sm mono', text:v})
      ]))),
      Utils.el('div', {class:'table-wrap', style:'max-height:320px'}, [
        (() => {
          const t = Utils.el('table', {class:'data'});
          t.appendChild(Utils.el('thead', {}, [Utils.el('tr', {}, [
            Utils.el('th', {text:'#'}), Utils.el('th', {text: Utils.t('you')}),
            Utils.el('th', {text: Utils.t('ai')}), Utils.el('th', {text:'Outcome'}),
            Utils.el('th', {text:'AI predicted'}), Utils.el('th', {text:'Conf.'})
          ])]));
          const tb = Utils.el('tbody');
          rounds.forEach(r => tb.appendChild(Utils.el('tr', {}, [
            Utils.el('td', {text: String(r.round)}),
            Utils.el('td', {}, [Utils.el('span', {class:'row', style:'gap:6px;flex-wrap:nowrap'}, [Utils.el('span', {class:'mv-ico'}, [GameRules.mark(r.playerMove)]), Utils.el('span', {text: Utils.t(r.playerMove)})])]),
            Utils.el('td', {}, [Utils.el('span', {class:'row', style:'gap:6px;flex-wrap:nowrap'}, [Utils.el('span', {class:'mv-ico'}, [GameRules.mark(r.aiMove)]), Utils.el('span', {text: Utils.t(r.aiMove)})])]),
            Utils.el('td', {}, [UI.badge(r.outcome)]),
            Utils.el('td', {text: r.aiPredicted || '—'}),
            Utils.el('td', {class:'mono', text: Utils.pct(r.aiConfidence || 0, 0)})
          ])));
          t.appendChild(tb);
          return t;
        })()
      ])
    ]);
    Modal.open({
      title:'Match ' + match.id, body, wide:true,
      footer:[
        Utils.el('button', {class:'btn', onclick:() => {
          ExportManager.json({match, rounds}, 'rps-match-' + match.id);
        }, icon:'download', text:Utils.t('exportJson')}),
        AuthManager.can('delete') ? Utils.el('button', {class:'btn btn-danger', onclick:() => {
          Modal.close();
          Modal.confirm({title:'Delete match', danger:true,
            body:'Delete ' + match.id + ' and its ' + rounds.length + ' rounds? You can undo this.',
            onConfirm: async () => {
              await Repository.deleteMatch(match.id);
              StatsEngine.compute(); SearchEngine.build();
              Toast.show('success','Match deleted', match.id + ' — press Undo to restore.');
              Pages.history.paint();
            }});
        }, icon:'trash', text:'Delete'}) : null,
        Utils.el('button', {class:'btn btn-primary', onclick:() => Modal.close(), text: Utils.t('close')})
      ].filter(Boolean)
    });
  },

  bulkDelete(){
    const ids = Array.from(this.selected);
    Modal.confirm({
      title:'Delete ' + ids.length + ' matches', danger:true,
      body:'This removes the selected matches and all their rounds. The action can be undone one match at a time.',
      onConfirm: async () => {
        const n = await Repository.deleteMatches(ids);
        this.selected.clear();
        StatsEngine.compute(); SearchEngine.build();
        Toast.show('success','Deleted', n + ' matches removed.');
        this.paint();
      }
    });
  },

  savePreset(){
    const name = 'preset-' + (StorageManager.get(LS.presets, []).length + 1);
    const list = StorageManager.get(LS.presets, []) || [];
    list.push({name, q: Utils.clone(this.q)});
    StorageManager.set(LS.presets, list);
    Toast.show('success','Preset saved', name);
  },
  loadPreset(){
    const list = StorageManager.get(LS.presets, []) || [];
    if (!list.length) return Toast.show('info','No presets','Save a filter combination first.');
    const body = Utils.el('div', {class:'stack'},
      list.map((p, i) => Utils.el('div', {class:'row'}, [
        Utils.el('span', {class:'t-sm', text: p.name}),
        Utils.el('button', {class:'btn btn-sm', style:'margin-left:auto', onclick:() => {
          Pages.history.q = Utils.deepMerge(Pages.history.q, p.q); Modal.close(); Pages.history.paint();
        }, text:'Apply'}),
        Utils.el('button', {class:'btn btn-sm btn-danger', onclick:() => {
          list.splice(i,1); StorageManager.set(LS.presets, list); Modal.close(); Pages.history.loadPreset();
        }, text:'Delete'})
      ])));
    Modal.open({title:'Filter presets', body});
  },

  exportRows(format){
    const res = Repository.query(Object.assign({}, this.q, {pageSize: 1e9, page:1}));
    const rows = res.rows.map(m => ({
      match_id:m.id, played_at:new Date(m.createdAt).toISOString(), result:m.result,
      player_score:m.playerScore, ai_score:m.aiScore, draws:m.draws, rounds:m.rounds,
      difficulty:m.difficulty, mode:m.mode, ai_read_rate:m.accuracy,
      avg_response_ms:m.avgResponseMs, duration_ms:m.durationMs, synthetic:!!m.synthetic
    }));
    if (format === 'csv') ExportManager.csv(rows, 'rps-history');
    else if (format === 'json') ExportManager.json(rows, 'rps-history');
    else ExportManager.pdf({title:'RPS Arena — Match History', name:'rps-history', rows: rows.slice(0,300),
      columns:['match_id','played_at','result','player_score','ai_score','difficulty','mode'],
      summary:['Filtered rows: ' + rows.length, 'Filters: ' + JSON.stringify(this.q)]});
  },
  destroy(){ this.selected.clear(); }
};

  period:'all', search:'',

      ])
    ]}));

    frag.appendChild(Utils.el('div', {id:'lb-body'}));
    return frag;
  },

  rows(){
    const cut = {today: Date.now()-86400000, week: Date.now()-7*86400000,
                 month: Date.now()-30*86400000, all: 0}[this.period];
    let list = State.leaderboard.filter(p => (p.lastSeen || 0) >= cut);
    if (this.search){
      const s = this.search.toLowerCase();
      list = list.filter(p => p.name.toLowerCase().includes(s));
    }
    return list.sort((a,b) => b.score - a.score)
      .map((p,i) => Object.assign({}, p, {displayRank: i+1}));
  },

  mount(){ this.paint(); },

  paint(){
    const host = document.getElementById('lb-body');
    if (!host) return;
    host.textContent = '';
    const rows = this.rows();
    const me = rows.find(p => p.isMe);

    // Podium for the top three.
    const top = rows.slice(0,3);
    if (top.length === 3){
      host.appendChild(Utils.el('div', {class:'grid g-3 mb-4'}, [1,0,2].map(i => {
        const p = top[i];
        return UI.card({class:'hoverable podium', body:[
          Utils.el('div', {class:'text-c stack', style:'gap:8px;align-items:center'}, [
            Utils.el('div', {class:'podium-medal medal-' + (i+1), 'aria-hidden':'true'},
              [Icons.svg(i === 0 ? 'crown' : 'medal')]),
            UI.avatar(p.name, p.avatar, 'lg'),
            Utils.el('div', {style:'font-weight:700', text: p.name}),
            Utils.el('div', {class:'t-xs dim', text: Utils.num(p.score) + ' pts · ' + Utils.pct(p.winRate)})
          ])
        ]});
      })));
    }

    host.appendChild(UI.table({
      columns:[
        {key:'displayRank', label: Utils.t('rank'), render: p => {
          const top3 = p.displayRank <= 3;
          const delta = (p.prevRank ?? p.displayRank) - p.displayRank;
          const rankEl = Utils.el('span', {class:'rank' + (top3 ? ' medal-' + p.displayRank : '')});
          if (top3) rankEl.appendChild(Icons.svg('medal'));
          else rankEl.textContent = String(p.displayRank);
          const move = Utils.el('span', {class:'rank-delta t-xs ' +
            (delta > 0 ? 'c-ok' : delta < 0 ? 'c-bad' : 'dim')});
          if (delta !== 0){
            move.appendChild(Icons.svg(delta > 0 ? 'arrowUp' : 'arrowDown'));
            move.appendChild(Utils.el('span', {text: String(Math.abs(delta))}));
          } else { move.textContent = '–'; }
          return Utils.el('span', {class:'row', style:'gap:6px;flex-wrap:nowrap'}, [rankEl, move]);
        }},
        {key:'name', label: Utils.t('player'), render: p => Utils.el('span', {class:'row', style:'gap:.6rem'}, [
          UI.avatar(p.name, p.avatar),
          Utils.el('span', {}, [
            Utils.el('div', {style:'font-weight:600', text: p.name + (p.isMe ? '  (you)' : '')}),
            Utils.el('div', {class:'t-xs dim', text: Utils.fromNow(p.lastSeen)})
          ])
        ])},
        {key:'score', label:'Score', render: p => Utils.el('strong', {class:'mono', text: Utils.num(p.score)})},
        {key:'played', label:'Played', render: p => Utils.num(p.played)},
        {key:'wins', label:'W / L / D', render: p => p.wins + ' / ' + p.losses + ' / ' + p.draws},
        {key:'winRate', label: Utils.t('winRate'), render: p => Utils.el('span', {class:'row', style:'gap:.5rem'}, [
          Utils.el('span', {class:'progress', style:'width:70px'},
            [Utils.el('i', {style:'width:' + (p.winRate*100).toFixed(0) + '%'})]),
          Utils.el('span', {class:'mono t-xs', text: Utils.pct(p.winRate)})
        ])},
        {key:'bestStreak', label: Utils.t('bestStreak'),
         render: p => Utils.el('span', {class:'row', style:'gap:5px;flex-wrap:nowrap'}, [
           Utils.el('span', {class:'mv-ico'}, [Icons.svg('flame')]),
           Utils.el('span', {class:'mono', text: String(p.bestStreak)})
         ])}
      ],
      rows, total: rows.length, pages:1, page:1, sort:'score', dir:'desc',
      emptyMessage:'No players in this period.',
      highlight: p => !!p.isMe
    }));

    if (me && me.displayRank > 10){
      host.appendChild(UI.card({class:'mt-4', body:[
        Utils.el('div', {class:'row'}, [
          Icons.svg('target'),
          Utils.el('div', {}, [
            Utils.el('div', {style:'font-weight:700',
              text:'You are ' + Utils.ordinal(me.displayRank) + ' of ' + rows.length}),
            Utils.el('div', {class:'t-xs dim',
              text: Utils.num((rows[9]?.score || 0) - me.score) + ' points from the top 10'})
          ]),
          Utils.el('button', {class:'btn btn-primary btn-sm', style:'margin-left:auto',
            onclick:() => Router.go('#/play'), text:'Climb the ladder →'})
        ])
      ]}));
    } else if (!me){
      host.appendChild(UI.card({class:'mt-4', body:[
        Utils.el('div', {class:'row'}, [
          Icons.svg('sparkle'),
          Utils.el('span', {class:'t-sm',
            text:'Play a match to appear on the leaderboard.'}),
          Utils.el('button', {class:'btn btn-primary btn-sm', style:'margin-left:auto',
            onclick:() => Router.go('#/play'), text:'Play now'})
        ])
      ]}));
    }
  },
  destroy(){}
};

/* ═══════════════ MODULE 32b: MOTION ═══════════════
   Entrance choreography and pointer physics. Everything here is progressive —
   with reduced-motion or animations off, content is simply present. */
const Motion = {
  _io: null,

  /** Stagger direct children of a container into view as it is scrolled to. */
  observe(root){
    if (!root) return;
    const enabled = State.config.animations !== false && !Utils.reducedMotion();
    const targets = Utils.$$('[data-reveal]', root);
    if (!enabled){ targets.forEach(t => t.classList.add('revealed')); return; }
    if (!('IntersectionObserver' in window)){
      targets.forEach(t => t.classList.add('revealed')); return;
    }
    if (this._io) this._io.disconnect();
    this._io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        e.target.classList.add('revealed');
        this._io.unobserve(e.target);
      });
    }, {threshold:0.06, rootMargin:'0px 0px -32px 0px'});
    targets.forEach(t => this._io.observe(t));
  },

  /** Tag a container's children for staggered reveal. */
  stagger(container, step){
    if (!container) return container;
    const delay = step ?? CONFIG.ui.revealStaggerMs;
    Array.from(container.children).forEach((child, i) => {
      child.setAttribute('data-reveal','');
      child.style.setProperty('--reveal-delay', (i * delay) + 'ms');
    });
    return container;
  },

  /** Subtle magnetic pull toward the cursor — used only on primary actions. */
  magnetize(el, strength){
    if (!el || State.config.animations === false || Utils.reducedMotion()) return;
    if (window.matchMedia && window.matchMedia('(hover: none)').matches) return;
    const k = strength ?? 0.28;
    let raf = 0, tx = 0, ty = 0;
    const apply = () => { el.style.transform = 'translate3d(' + tx + 'px,' + ty + 'px,0)'; raf = 0; };
    el.addEventListener('pointermove', ev => {
      const r = el.getBoundingClientRect();
      tx = (ev.clientX - (r.left + r.width/2)) * k;
      ty = (ev.clientY - (r.top + r.height/2)) * k;
      if (!raf) raf = requestAnimationFrame(apply);
    });
    el.addEventListener('pointerleave', () => {
      tx = ty = 0;
      if (!raf) raf = requestAnimationFrame(apply);
    });
  },

  /** Apply pointer physics + ripple to every control inside a subtree. */
  enhance(root){
    Utils.$$('.btn-primary, .btn-lg', root || document).forEach(b => this.magnetize(b, 0.22));
    Utils.$$('.btn, .throw-btn', root || document).forEach(b => {
      if (b.dataset.rippled === '1') return;
      b.dataset.rippled = '1';
      b.addEventListener('pointerdown', ev => Utils.ripple(ev, b));
    });
  }
};

  },

  wireTopbar(){
    const on = (id, ev, fn) => {

    // Global search with a live results listbox.
    const input = document.getElementById('global-search');
    const results = document.getElementById('search-results');
    if (input && results){
      const close = () => { results.hidden = true; results.textContent = '';
        input.setAttribute('aria-expanded','false'); };
      const run = Utils.debounce(() => {
        const hits = SearchEngine.query(input.value);
        results.textContent = '';
        if (!hits.length){
          if (input.value.trim().length >= 2){
            results.hidden = false; input.setAttribute('aria-expanded','true');
            results.appendChild(Utils.el('li', {}, [
              Utils.el('div', {class:'empty', style:'padding:1.5rem'}, [
                Utils.el('div', {text: Utils.t('noResults')})])]));
          } else close();
          return;
        }
        results.hidden = false;
        input.setAttribute('aria-expanded','true');
        hits.forEach(h => {
          results.appendChild(Utils.el('li', {role:'option'}, [
            Utils.el('button', {onclick:() => { close(); input.value = ''; Router.go(h.route); }}, [
              Icons.svg(h.icon),
              Utils.el('span', {style:'min-width:0'}, [
                Utils.el('div', {class:'t-sm', style:'font-weight:600', text:h.title}),
                Utils.el('div', {class:'t-xs dim', text:h.subtitle})
              ]),
              Utils.el('span', {class:'chip', style:'margin-left:auto', text:h.type})
            ])
          ]));
        });
      }, CONFIG.ui.searchDebounceMs);
      input.addEventListener('input', run);
      input.addEventListener('keydown', e => {
        if (e.key === 'Escape'){ close(); input.blur(); }
        if (e.key === 'ArrowDown'){ e.preventDefault(); results.querySelector('button')?.focus(); }
      });
      document.addEventListener('click', e => {
        if (!e.target.closest('.search-wrap')) close();
      });
    }
  },

  wireGlobalKeys(){
    document.addEventListener('keydown', e => {
      const typing = e.target && /input|textarea|select/i.test(e.target.tagName);
      if (e.key === 'Escape'){ Modal.closeAll(); NotificationManager.close(); return; }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
        e.preventDefault(); UndoManager.undo().then(() => Router.reload()); return;
      }
      if (typing) return;
      if (e.key === '/'){ e.preventDefault(); document.getElementById('global-search')?.focus(); }
      else if (e.key === '?'){ e.preventDefault(); Router.go('#/help'); }
      else if (e.key.toLowerCase() === 't' && Router.current !== 'play'){ ThemeManager.cycle(); }
      else if (e.key.toLowerCase() === 'm'){
        ConfigManager.set('sound', !State.config.sound); this.syncSound();
      }
    });
    // First gesture unlocks the AudioContext per browser autoplay policy.
    const unlock = () => {
      AudioEngine.gestureSeen = true;
      AudioEngine.ensure();
      try { AudioEngine.ctx?.state === 'suspended' && AudioEngine.ctx.resume(); } catch(_){}
      document.removeEventListener('pointerdown', unlock);
      document.removeEventListener('keydown', unlock);
    };
    document.addEventListener('pointerdown', unlock);
    document.addEventListener('keydown', unlock);
    ['pointerdown','keydown'].forEach(ev =>
      document.addEventListener(ev, Utils.throttle(() => AuthManager.touch(), 5000)));
  },

  syncUser(){
    const a = document.getElementById('user-avatar');

  syncSound(){
    const b = document.getElementById('btn-sound');

      b.setAttribute('aria-label', State.config.sound ? 'Mute sound' : 'Unmute sound');
    }
  },
  setLive(on, label){
    const pill = document.getElementById('live-pill');
    const text = document.getElementById('live-text');
    if (pill) pill.className = 'pill ' + (on ? 'ok' : 'warn');
    if (text) text.textContent = label || (on ? 'LIVE' : 'PAUSED');
  },

  /** Debug FPS/heap overlay. */
  togglePerf(on){
    if (!on){
      cancelAnimationFrame(this._perfRaf);
      this._perfNode?.remove(); this._perfNode = null; return;
    }
    if (this._perfNode) return;
    this._perfNode = Utils.el('div', {class:'pill mono',
      style:'position:fixed;bottom:12px;left:12px;z-index:900'});
    document.body.appendChild(this._perfNode);
    let frames = 0, last = performance.now();
    const loop = now => {
      frames++;
      if (now - last >= 1000){
        const mem = performance.memory
          ? ' · ' + Math.round(performance.memory.usedJSHeapSize/1048576) + 'MB' : '';
        this._perfNode.textContent = frames + ' fps' + mem +
          ' · ' + Object.keys(State.charts).length + ' charts';
        frames = 0; last = now;
      }
      this._perfRaf = requestAnimationFrame(loop);
    };
    this._perfRaf = requestAnimationFrame(loop);
  },

  splash(pct, label){
    const bar = document.getElementById('splash-bar-fill');
    const status = document.getElementById('splash-status');
    if (bar) bar.style.width = Utils.clamp(pct, 0, 100) + '%';
    if (status && label) status.textContent = label;
  },
  hideSplash(){
    const s = document.getElementById('splash');
    if (!s) return;
    s.classList.add('hide');
    setTimeout(() => { s.hidden = true; }, 700);
  }
};

/* ═══════════════ MODULE 34: APP BOOTSTRAP ═══════════════ */
const App = {
  /** Seven-phase deterministic boot sequence. */
  async init(){
    const t0 = performance.now();
    try {
      /* ── PHASE 0: pre-init ── */
      ErrorBoundary.install();
      Logger.setLevel(CONFIG.app.debug ? 'DEBUG' : 'INFO');
      Logger.info(CONFIG.app.name, 'v' + CONFIG.app.version, 'booting…');
      UIController.splash(4, 'Installing error boundary…');

      const crashed = (() => { try { return localStorage.getItem(LS.crash) === '1'; } catch(_){ return false; } })();
      try { localStorage.setItem(LS.crash, '1'); } catch(_){}
      window.addEventListener('beforeunload', () => {
        try { localStorage.removeItem(LS.crash); } catch(_){}
      });

      // Detect CDN failures for the degraded-mode banner.
      const expect = {chartjs:'Chart', dayjs:'dayjs', jspdf:'jspdf', papa:'Papa',
                      fuse:'Fuse', lucide:'lucide'};
      State.degraded = Object.keys(expect).filter(k => !window[expect[k]]);
      if (window.dayjs){
        try {
          window.dayjs_plugin_relativeTime && dayjs.extend(window.dayjs_plugin_relativeTime);
          window.dayjs_plugin_duration && dayjs.extend(window.dayjs_plugin_duration);
          window.dayjs_plugin_advancedFormat && dayjs.extend(window.dayjs_plugin_advancedFormat);
        } catch(err){ Logger.warn('dayjs plugin registration failed', err); }
      }

      /* ── PHASE 1: storage ── */
      UIController.splash(12, 'Opening storage…');
      StorageManager.init();
      await StorageManager.openDB();

      /* ── PHASE 2: configuration ── */
      UIController.splash(20, 'Applying preferences…');
      ConfigManager.load();
      ThemeManager.apply(State.config.theme);
      ThemeManager.applyLanguage(State.config.lang);
      ThemeManager.applyDisplay();
      if (State.config.accent && State.config.accent !== DEFAULT_CONFIG.accent){
        ThemeManager.setAccent(State.config.accent);
      }
      Logger.setLevel(State.config.debug ? 'DEBUG' : 'INFO');
      ChartEngine.applyDefaults();
      AudioEngine.setVolume(State.config.volume);

      /* ── PHASE 3: auth restore ── */
      UIController.splash(28, 'Restoring session…');
      AuthManager.restore();
      NotificationManager.load();
      AchievementSystem.load();

      /* ── PHASE 4: data ── */
      const existing = await StorageManager.count('matches');
      if (existing === 0){
        UIController.splash(34, Utils.t('seeding'));
        const {matches, rounds, players} = await DataGenerator.generate((p, label) =>
          UIController.splash(28 + p*0.42, label));
        await StorageManager.putAll('matches', matches);
        await StorageManager.putAll('rounds', rounds);
        await StorageManager.putAll('players', players);
        StorageManager.set(LS.seeded, {at: Date.now(), seed: CONFIG.data.seed,
          matches: matches.length, rounds: rounds.length});
        // Memory fallback path: keep the corpus live even without IndexedDB.
        State.matches = matches; State.rounds = rounds; State.leaderboard = players;
        EventBus.emit('data:seeded', {matches: matches.length, rounds: rounds.length});
        Logger.info('seeded', matches.length, 'matches /', rounds.length, 'rounds');
      } else {
        UIController.splash(56, 'Loading your history…');
        await Repository.hydrate();
      }
      if (!State.matches.length) await Repository.hydrate();
      // Replay any live matches held in the localStorage mirror (file:// / no-IDB path).
      Repository.mergeMirror();

      // The model must exist before StatsEngine.compute() reads its accuracy.
      MLEngine.init();

      UIController.splash(74, 'Computing statistics…');
      StatsEngine.compute();
      SearchEngine.build();

      /* ── PHASE 5: ML ── */
      UIController.splash(80, 'Waking the opponent…');
      // Warm the model from historical rounds when it has no memory yet.
      if (MLEngine.model.totalRounds === 0 && State.rounds.length){
        const chrono = State.rounds.slice().sort((a,b) => a.timestamp - b.timestamp).slice(-400);
        const seen = [];
        for (const r of chrono){
          MLEngine.learn(seen.slice(), r.playerMove, r.outcome);
          seen.push(r);
          if (seen.length > 60) seen.shift();
        }
        Logger.info('model warmed on', chrono.length, 'historical rounds');
      }

      /* ── PHASE 6: UI ── */
      UIController.splash(90, 'Rendering interface…');
      UIController.init();
      ParticleSystem.init();
      ConfettiSystem.init();
      Router.init();
      if (State.config.perfMonitor) UIController.togglePerf(true);
      if (window.lucide?.createIcons){ try { lucide.createIcons(); } catch(_){} }

      /* ── PHASE 7: background services ── */
      UIController.splash(98, 'Starting services…');
      this.restartRefresh();
      State.timers.session = setInterval(() => AuthManager.watch(), 60000);
      State.timers.health = setInterval(() => this.healthCheck(false), CONFIG.ui.healthCheckMs);
      State.timers.autosave = setInterval(() => this.autoSave(), CONFIG.storage.autoSaveMs);
      this.registerServiceWorker();

      // Silent: the seeded history legitimately satisfies several rules at once,
      // and a wall of toasts is not a welcome.
      AchievementSystem.evaluate(true);
      State.ready = true;
      UIController.splash(100, 'Ready.');
      setTimeout(() => UIController.hideSplash(), 260);
      EventBus.emit('app:ready', {ms: Math.round(performance.now() - t0)});
      Logger.info('ready in', Math.round(performance.now() - t0), 'ms');

      if (State.degraded.length){
        Toast.show('warning', 'Degraded mode', Utils.t('degraded') + ' (' + State.degraded.join(', ') + ')', 8000);
      }
      if (crashed){
        Modal.confirm({
          title:'Recover previous session?',
          body:'The last session ended unexpectedly. Your data is intact — would you like to jump back to where you were?',
          confirmLabel:'Resume', onConfirm:() => Router.go('#/play')
        });
      }
      if (!State.user){
        setTimeout(() => Toast.show('info','Welcome to RPS Arena',
          'Press Play to start, or create a profile from the avatar button.', 7000), 900);
      }
    } catch(err){
      ErrorBoundary.handle({type:'BOOT', err});
      UIController.splash(100, 'Boot failed — see console.');
      const s = document.getElementById('splash-status');
      if (s) s.textContent = 'Startup error: ' + (err?.message || 'unknown');
      setTimeout(() => {
        UIController.hideSplash();
        const shell = document.getElementById('app-shell');
        if (shell) shell.hidden = false;
        try { UIController.init(); Router.init(); } catch(_){}
      }, 1200);
    }
  },

  /** Background refresh: recompute derived data and nudge the active page. */
  restartRefresh(){
    this.stopRefresh();
    if (!State.config.liveSimulation){ UIController.setLive(false, 'PAUSED'); return; }
    UIController.setLive(true, 'LIVE');
    State.timers.refresh = setInterval(() => {
      try {
        StatsEngine.compute();
        AchievementSystem.evaluate();
        StorageManager.set(LS.lastSync, Date.now());
        EventBus.emit('data:refreshed', {at: Date.now()});
      } catch(err){ ErrorBoundary.handle({type:'REFRESH', err}); }
    }, Utils.clamp(State.config.refreshMs, 5000, 300000));
  },
  stopRefresh(){
    if (State.timers.refresh){ clearInterval(State.timers.refresh); State.timers.refresh = null; }
    UIController.setLive(false, 'PAUSED');
  },

  /** Periodic self-diagnostic. @param {boolean} verbose */
  healthCheck(verbose){
    const checks = [
      ['localStorage', StorageManager._lsOk],
      ['IndexedDB', StorageManager._idbOk],
      ['Chart.js', ChartEngine.available],
      ['Web Audio', !!(window.AudioContext || window.webkitAudioContext)],
      ['Data loaded', State.matches.length > 0],
      ['Model live', !!MLEngine.model],
      ['Router', !!Router.current]
    ];
    const failed = checks.filter(c => !c[1]).map(c => c[0]);
    Logger.debug('health check', checks);
    if (verbose){
      Modal.open({
        title:'System health', body: Utils.el('div', {class:'stack'},
          checks.map(([name, ok]) => Utils.el('div', {class:'row',
            style:'justify-content:space-between;padding:.4rem 0;border-bottom:1px solid var(--border-subtle)'}, [
            Utils.el('span', {class:'t-sm', text:name}),
            Utils.el('span', {class:'badge ' + (ok ? 'win' : 'loss'), text: ok ? 'OK' : 'UNAVAILABLE'})
          ]))),
        footer:[Utils.el('button', {class:'btn btn-primary', onclick:() => Modal.close(),
          text: Utils.t('close')})]
      });
    } else if (failed.length && failed.length > 2){
      Logger.warn('degraded subsystems:', failed.join(', '));
    }
    return failed;
  },

  /** Persist volatile state on a timer so a crash loses nothing. */
  autoSave(){
    try {
      ConfigManager.save();
      AchievementSystem.save();
      NotificationManager.save();
      if (MLEngine.model) MLEngine.save();
      Logger.debug('auto-saved');
    } catch(err){ Logger.warn('auto-save failed', err); }
  },

  /** Register an inline service worker for offline use (HTTPS/localhost only). */
  registerServiceWorker(){
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
    try {
      const code = [
        "self.addEventListener('install', e => self.skipWaiting());",
        "self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));",
        "self.addEventListener('fetch', e => {",
        "  if (e.request.method !== 'GET') return;",
        "  e.respondWith(caches.open('rps-v1').then(c =>",
        "    c.match(e.request).then(hit =>",
        "      hit || fetch(e.request).then(res => {",
        "        try { c.put(e.request, res.clone()); } catch(_){}",
        "        return res;",
        "      }).catch(() => hit)",
        "    )",
        "  ));",
        "});"
      ].join('\n');
      const blob = new Blob([code], {type:'application/javascript'});
      const url = URL.createObjectURL(blob);
      navigator.serviceWorker.register(url)
        .then(() => Logger.info('service worker registered'))
        .catch(err => Logger.warn('service worker registration failed', err));
    } catch(err){ Logger.warn('service worker unavailable', err); }
  }
};

/* ═══════════════ IGNITION ═══════════════ */
if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', () => App.init());
} else {
  App.init();
}
window.RPS = {CONFIG, State, App, Router, GameEngine, MLEngine, StatsEngine,
               Repository, StorageManager, ExportManager, Utils, EventBus};
})();
</script>
