const AchievementSystem = {
  /** @returns {Object} id → {at:number} */
  load(){
    State.achievements = StorageManager.get(LS.achievements, {}) || {};
    return State.achievements;
  },
  save(){ StorageManager.set(LS.achievements, State.achievements); },
  /** Evaluate every rule and unlock what has been earned.
   * @param {boolean} [silent] award without celebrating — used for the first boot,
   *   where the seeded 90-day history would otherwise unlock a dozen at once.
   * @returns {Object[]} newly unlocked */
  evaluate(silent){
    const stats = State.stats || StatsEngine.compute();
    const ctx = {
      matches: State.matches,
      visited: new Set(StorageManager.get('rps_visited', [])),
      flags: StorageManager.get('rps_flags', {})
    };
    const fresh = [];
    for (const a of ACHIEVEMENTS){
      if (State.achievements[a.id]) continue;
      let ok = false;
      try { ok = !!a.test(stats, ctx); }
      catch(err){ Logger.warn('achievement rule failed:', a.id, err); }
      if (ok){
        State.achievements[a.id] = {at: Date.now()};
        fresh.push(a);
      }
    }
    if (fresh.length){
      this.save();
      // Never celebrate before the app is ready — the boot-time sweep over seeded
      // history legitimately satisfies several rules at once.
      const quiet = silent || !State.ready;
      fresh.forEach(a => {
        EventBus.emit('achievement:unlocked', a);
        if (quiet) return;
        if (State.config.notifyAchievement){
          Toast.show('success', a.name, a.desc + '  ·  +' + a.points + ' pts', 6000);
          NotificationManager.push('success','Achievement unlocked', a.name + ' — ' + a.desc);
          AudioEngine.play('achievement');
        }
      });
      // One celebration per batch, never one per achievement.
      if (!quiet && State.config.notifyAchievement) ConfettiSystem.burst();
    }
    return fresh;
  },
  /** @returns {{earned:number,total:number,points:number,maxPoints:number}} */
  summary(){
    const earned = ACHIEVEMENTS.filter(a => State.achievements[a.id]);
    return {
      earned: earned.length, total: ACHIEVEMENTS.length,
      points: Utils.sum(earned.map(a => a.points)),
      maxPoints: Utils.sum(ACHIEVEMENTS.map(a => a.points))
    };
  },
  /** Record a one-off flag that some achievements depend on. */
  flag(key){
    const f = StorageManager.get('rps_flags', {});
    f[key] = true; StorageManager.set('rps_flags', f);
  },
  markVisited(route){
    const v = new Set(StorageManager.get('rps_visited', []));
    v.add(route); StorageManager.set('rps_visited', Array.from(v));
  }
};

/* ═══════════════ MODULE 17: AUDIO ENGINE ═══════════════ */
/** All sound is synthesised at runtime — the app ships zero audio assets. */
const AudioEngine = {
  ctx: null, master: null, unlocked: false, gestureSeen: false,

  /** Lazily create the AudioContext on the first user gesture (autoplay policy).
   *  Before any gesture the browser refuses to start the context and logs a warning,
   *  so construction is deferred rather than attempted and failed. */
  ensure(){
    if (this.ctx) return true;
    if (!this.gestureSeen) return false;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = Utils.clamp(State.config.volume, 0, CONFIG.audio.masterCeiling);
      this.master.connect(this.ctx.destination);
      this.unlocked = true;
      return true;
    } catch(err){ Logger.warn('Web Audio unavailable', err); return false; }
  },
  setVolume(v){
    State.config.volume = Utils.clamp(Number(v) || 0, 0, 1);
    if (this.master) this.master.gain.value = Utils.clamp(State.config.volume, 0, CONFIG.audio.masterCeiling);
  },
  /** Emit a single shaped oscillator tone.
   * @param {number} freq @param {number} dur @param {string} type @param {number} [gain] @param {number} [delay] */
  tone(freq, dur, type, gain, delay){
    if (!State.config.sound || Utils.reducedMotion()) return;
    if (!this.ensure()) return;
    try {
      const t0 = this.ctx.currentTime + (delay || 0);
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.001, gain ?? 0.22), t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(this.master);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    } catch(err){ Logger.debug('tone failed', err); }
  },
  /** Frequency sweep — used for whooshes and alarms. */
  sweep(from, to, dur, type, gain){
    if (!State.config.sound || Utils.reducedMotion()) return;
    if (!this.ensure()) return;
    try {
      const t0 = this.ctx.currentTime;
      const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
      osc.type = type || 'sawtooth';
      osc.frequency.setValueAtTime(from, t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(1,to), t0 + dur);
      g.gain.setValueAtTime(gain ?? 0.16, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(this.master);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    } catch(err){ Logger.debug('sweep failed', err); }
  },
  /** Short filtered noise burst for percussive effects. */
  noise(dur, gain){
    if (!State.config.sound || Utils.reducedMotion()) return;
    if (!this.ensure()) return;
    try {
      const len = Math.floor(this.ctx.sampleRate * dur);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2);
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const g = this.ctx.createGain(); g.gain.value = gain ?? 0.12;
      const flt = this.ctx.createBiquadFilter(); flt.type = 'bandpass'; flt.frequency.value = 1400;
      src.connect(flt); flt.connect(g); g.connect(this.master); src.start();
    } catch(err){ Logger.debug('noise failed', err); }
  },
  /** Named sound effects. @param {string} name */
  play(name){
    switch(name){
      case 'hover':   this.tone(880, 0.05, 'sine', 0.05); break;
      case 'click':   this.tone(520, 0.07, 'square', 0.10); break;
      case 'select':  this.tone(660, 0.09, 'triangle', 0.14); this.tone(990, 0.07, 'sine', 0.08, 0.05); break;
      case 'throw':   this.sweep(300, 700, 0.16, 'triangle', 0.10); break;
      case 'win':     [523.25, 659.25, 783.99, 1046.5].forEach((f,i) => this.tone(f, 0.22, 'sine', 0.20, i*0.075)); break;
      case 'loss':    this.tone(200, 0.30, 'sawtooth', 0.16); this.tone(150, 0.34, 'square', 0.10, 0.06); break;
      case 'draw':    this.tone(440, 0.16, 'sine', 0.13); this.tone(440, 0.16, 'sine', 0.13, 0.19); break;
      case 'matchWin':[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>this.tone(f,0.30,'triangle',0.22,i*0.10)); break;
      case 'matchLoss':[392,349.23,311.13,261.63].forEach((f,i)=>this.tone(f,0.30,'sawtooth',0.15,i*0.13)); break;
      case 'achievement':[659.25,830.61,987.77,1318.5].forEach((f,i)=>this.tone(f,0.26,'sine',0.20,i*0.08)); this.noise(0.20,0.05); break;
      case 'warn':    this.tone(740, 0.13, 'square', 0.15); this.tone(740, 0.13, 'square', 0.15, 0.17); break;
      case 'error':   this.tone(160, 0.34, 'sawtooth', 0.17); break;
      case 'notify':  this.tone(1046.5, 0.11, 'sine', 0.12); this.tone(1318.5, 0.11, 'sine', 0.10, 0.09); break;
      case 'tick':    this.tone(1200, 0.03, 'square', 0.05); break;
      default: break;
    }
  },
  /** Optional low ambient drone, off by default. */
  toggleMusic(on){
    try{
      if (on){
        if (!this.ensure() || this._drone) return;
        const o1 = this.ctx.createOscillator(), o2 = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o1.type = 'sine'; o1.frequency.value = 55;
        o2.type = 'sine'; o2.frequency.value = 82.5;
        g.gain.value = 0.025;
        o1.connect(g); o2.connect(g); g.connect(this.master);
        o1.start(); o2.start();
        this._drone = {o1, o2, g};
      } else if (this._drone){
        try { this._drone.o1.stop(); this._drone.o2.stop(); } catch(_){}
        this._drone = null;
      }
    } catch(err){ Logger.debug('music toggle failed', err); }
  },
  vibrate(ms){
    if (!State.config.vibration) return;
    try { navigator.vibrate && navigator.vibrate(ms); } catch(_){}
  }
};

/* ═══════════════ MODULE 18: PARTICLE SYSTEM ═══════════════ */
const ParticleSystem = {
  canvas:null, ctx:null, parts:[], raf:0, running:false, w:0, h:0,

  init(){
    this.canvas = document.getElementById('particles');
    if (!this.canvas || !this.canvas.getContext) return false;
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', Utils.debounce(() => this.resize(), 200));
    this.seed();
    if (State.config.particles && !Utils.reducedMotion()) this.start();
    document.addEventListener('visibilitychange', () => {
      document.hidden ? this.stop() : (State.config.particles && !Utils.reducedMotion() && this.start());
    });
    return true;
  },
  resize(){
    if (!this.canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.w = window.innerWidth; this.h = window.innerHeight;
    this.canvas.width = this.w * dpr; this.canvas.height = this.h * dpr;
    this.canvas.style.width = this.w + 'px'; this.canvas.style.height = this.h + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  },
  seed(){
    const palette = CONFIG.ui.chartColors;
    this.parts = [];
    for (let i = 0; i < CONFIG.ui.particleCount; i++){
      this.parts.push({
        x: Math.random()*this.w, y: Math.random()*this.h,
        r: Math.random()*2.1 + 0.6,
        vx: (Math.random()-0.5)*0.22, vy: (Math.random()-0.5)*0.22,
        a: Math.random()*0.4 + 0.12,
        c: palette[Math.floor(Math.random()*palette.length)],
        pulse: Math.random()*Math.PI*2
      });
    }
  },
  start(){
    if (this.running || !this.ctx) return;
    this.running = true;
    const loop = () => {
      if (!this.running) return;
      this.frame();
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  },
  stop(){ this.running = false; cancelAnimationFrame(this.raf); },
  frame(){
    const c = this.ctx;
    c.clearRect(0,0,this.w,this.h);
    for (const p of this.parts){
      p.x += p.vx; p.y += p.vy; p.pulse += 0.02;
      if (p.x < -10) p.x = this.w + 10; if (p.x > this.w + 10) p.x = -10;
      if (p.y < -10) p.y = this.h + 10; if (p.y > this.h + 10) p.y = -10;
      c.globalAlpha = p.a * (0.7 + Math.sin(p.pulse)*0.3);
      c.fillStyle = p.c;
      c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI*2); c.fill();
    }
    // Constellation links between nearby particles.
    c.globalAlpha = 0.05; c.strokeStyle = CONFIG.ui.chartColors[0]; c.lineWidth = 1;
    for (let i = 0; i < this.parts.length; i++){
      for (let j = i+1; j < this.parts.length; j++){
        const a = this.parts[i], b = this.parts[j];
        const dx = a.x-b.x, dy = a.y-b.y, d2 = dx*dx + dy*dy;
        if (d2 < 14400){
          c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke();
        }
      }
    }
    c.globalAlpha = 1;
  },
  setEnabled(on){
    State.config.particles = !!on;
    if (on && !Utils.reducedMotion()) this.start();
    else { this.stop(); this.ctx && this.ctx.clearRect(0,0,this.w,this.h); }
  }
};

/* ═══════════════ MODULE 19: CONFETTI ═══════════════ */
const ConfettiSystem = {
  canvas:null, ctx:null, bits:[], raf:0, w:0, h:0,
  init(){
    this.canvas = document.getElementById('confetti');
    if (!this.canvas || !this.canvas.getContext) return false;
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', Utils.debounce(() => this.resize(), 200));
    return true;
  },
  resize(){
    if (!this.canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.w = window.innerWidth; this.h = window.innerHeight;
    this.canvas.width = this.w*dpr; this.canvas.height = this.h*dpr;
    this.canvas.style.width = this.w+'px'; this.canvas.style.height = this.h+'px';
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  /** Fire a celebratory burst from the top of the viewport. */
  burst(count){
    if (!this.ctx || Utils.reducedMotion() || State.config.animations === false) return;
    const palette = ['#6366f1','#06b6d4','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#fbbf24'];
    const n = count || CONFIG.ui.confettiCount;
    for (let i = 0; i < n; i++){
      this.bits.push({
        x: this.w/2 + (Math.random()-0.5)*this.w*0.6, y: -20 - Math.random()*this.h*0.2,
        vx: (Math.random()-0.5)*7, vy: Math.random()*4 + 2,
        w: Math.random()*8 + 4, h: Math.random()*5 + 3,
        rot: Math.random()*Math.PI, vr: (Math.random()-0.5)*0.28,
        c: palette[Math.floor(Math.random()*palette.length)], life: 1
      });
    }
    if (!this.raf) this.loop();
  },
  loop(){
    const step = () => {
      const c = this.ctx;
      c.clearRect(0,0,this.w,this.h);
      for (let i = this.bits.length - 1; i >= 0; i--){
        const b = this.bits[i];
        b.vy += 0.14; b.x += b.vx; b.y += b.vy; b.rot += b.vr; b.vx *= 0.995;
        if (b.y > this.h + 40){ this.bits.splice(i,1); continue; }
        c.save(); c.translate(b.x,b.y); c.rotate(b.rot);
        c.fillStyle = b.c; c.globalAlpha = Utils.clamp(b.life, 0, 1);
        c.fillRect(-b.w/2, -b.h/2, b.w, b.h);
        c.restore();
      }
      c.globalAlpha = 1;
      if (this.bits.length){ this.raf = requestAnimationFrame(step); }
      else { cancelAnimationFrame(this.raf); this.raf = 0; c.clearRect(0,0,this.w,this.h); }
    };
    this.raf = requestAnimationFrame(step);
  }
};

/* ═══════════════ MODULE 20: TOAST ═══════════════ */
const Toast = {
  _queue: [],
  /** @param {'success'|'info'|'warning'|'error'} level @param {string} title
   *  @param {string} [msg] @param {number} [ms] */
  show(level, title, msg, ms){
    const root = document.getElementById('toasts');
    if (!root) return null;
    const dur = ms || CONFIG.ui.toastDuration;
    while (root.children.length >= CONFIG.ui.toastMax) root.firstElementChild.remove();

    const icons = {success:'checkCircle', info:'info', warning:'alert', error:'xCircle'};
    const node = Utils.el('div', {class:'toast ' + level, role:'alert'}, [
      Utils.el('span', {class:'t-ico', 'aria-hidden':'true'}, [Icons.svg(icons[level] || 'info')]),
      Utils.el('div', {class:'t-body'}, [
        Utils.el('div', {class:'t-title', text: String(title)}),
        msg ? Utils.el('div', {class:'t-msg', text: String(msg)}) : null
      ]),
      Utils.el('button', {class:'icon-btn', style:'width:24px;height:24px',
        'aria-label':'Dismiss notification', onclick:() => this.dismiss(node)}, [Icons.svg('x')])
    ]);
    const timer = Utils.el('i', {class:'t-timer'});
    timer.style.animationDuration = dur + 'ms';
    timer.style.width = '100%';
    node.appendChild(timer);
    root.appendChild(node);

    if (level === 'error') AudioEngine.play('error');
    else if (level === 'warning') AudioEngine.play('warn');
    else AudioEngine.play('notify');

    const id = setTimeout(() => this.dismiss(node), dur);
    node.addEventListener('mouseenter', () => clearTimeout(id));
    return node;
  },
  dismiss(node){
    if (!node || !node.parentNode) return;
    node.classList.add('out');
    setTimeout(() => node.remove(), 260);
  },
  clear(){ const r = document.getElementById('toasts'); if (r) r.textContent = ''; }
};

/* ═══════════════ MODULE 21: NOTIFICATION MANAGER ═══════════════ */
const NotificationManager = {
  load(){
    State.notifications = StorageManager.get(LS.notifications, []) || [];
    this.updateBadge();
  },
  save(){ StorageManager.set(LS.notifications, State.notifications.slice(0, CONFIG.alerts.maxShown)); },
  /** @param {string} level @param {string} title @param {string} body @returns {Object} */
  push(level, title, body){
    const n = {id: Utils.uuid(), level, title, body, at: Date.now(), read: false};
    State.notifications.unshift(n);
    if (State.notifications.length > CONFIG.alerts.maxShown) State.notifications.length = CONFIG.alerts.maxShown;
    this.save(); this.updateBadge();
    EventBus.emit('notification:new', n);
    return n;
  },
  unread(){ return State.notifications.filter(n => !n.read).length; },
  markAllRead(){ State.notifications.forEach(n => n.read = true); this.save(); this.updateBadge(); this.render(); },
  clearAll(){ State.notifications = []; this.save(); this.updateBadge(); this.render(); },
  updateBadge(){
    const btn = document.getElementById('btn-notif');
    if (!btn) return;
    const old = btn.querySelector('.dot'); if (old) old.remove();
    const n = this.unread();
    if (n > 0){
      btn.appendChild(Utils.el('span', {class:'dot', 'aria-hidden':'true', text: n > 99 ? '99+' : String(n)}));
      btn.setAttribute('aria-label', 'Notifications, ' + n + ' unread');
    } else {
      btn.setAttribute('aria-label', 'Notifications');
    }
  },
  /** Open the slide-over notification centre. */
  open(){
    const root = document.getElementById('drawer-root');
    if (!root) return;
    if (root.firstChild) return this.close();
    const drawer = Utils.el('div', {class:'drawer', role:'dialog', 'aria-modal':'false',
      'aria-label':'Notification centre'});
    drawer.appendChild(Utils.el('div', {class:'drawer-head'}, [
      Utils.el('h3', {text: Utils.t('notifications')}),
      Utils.el('div', {class:'card-actions'}, [
        Utils.el('button', {class:'btn btn-sm', onclick:() => this.markAllRead(), text: Utils.t('markAllRead')}),
        Utils.el('button', {class:'btn btn-sm', onclick:() => this.clearAll(), text: Utils.t('clearAll')}),
        Utils.el('button', {class:'icon-btn', 'aria-label': Utils.t('close'), onclick:() => this.close()}, [Icons.svg('x')])
      ])
    ]));
    drawer.appendChild(Utils.el('div', {class:'drawer-body', id:'drawer-body'}));
    root.appendChild(drawer);
    this.render();
    const onEsc = e => { if (e.key === 'Escape'){ this.close(); document.removeEventListener('keydown', onEsc); } };
    document.addEventListener('keydown', onEsc);
    drawer.querySelector('button')?.focus();
  },
  close(){ const r = document.getElementById('drawer-root'); if (r) r.textContent = ''; },
  render(){
    const body = document.getElementById('drawer-body');
    if (!body) return;
    body.textContent = '';
    if (!State.notifications.length){
      body.appendChild(Utils.el('div', {class:'empty'}, [
        Utils.el('div', {class:'e-ico', 'aria-hidden':'true'}, [Icons.svg('bellOff')]),
        Utils.el('div', {text: Utils.t('noNotifications')})
      ]));
      return;
    }
    const icons = {success:'checkCircle', info:'info', warning:'alert', error:'xCircle'};
    State.notifications.forEach(n => {
      body.appendChild(Utils.el('div', {class:'notif' + (n.read ? '' : ' unread')}, [
        Utils.el('div', {class:'row', style:'gap:.5rem;align-items:flex-start'}, [
          Utils.el('span', {class:'t-ico', 'aria-hidden':'true'}, [Icons.svg(icons[n.level] || 'info')]),
          Utils.el('strong', {class:'t-sm', text: n.title})
        ]),
        Utils.el('div', {class:'t-xs muted', style:'margin-top:4px', text: n.body || ''}),
        Utils.el('div', {class:'t-xs dim mono', style:'margin-top:6px', text: Utils.fromNow(n.at)})
      ]));
    });
    State.notifications.forEach(n => n.read = true);
    this.save(); this.updateBadge();
  },
  /** Generate a structured alert object for export/acknowledgement. */
  createAlert(severity, message, confidence, action, context){
    const alert = {
      alert_id: Utils.uuid(),
      severity: CONFIG.alerts.severities.includes(severity) ? severity : 'low',
      message: String(message),
      confidence: Number(Utils.clamp(confidence ?? 0.5, 0, 1).toFixed(3)),
      recommended_action: String(action || 'Review your recent play patterns.'),
      generated_at: new Date().toISOString(),
      status: 'open',
      createdAt: Date.now(),
      context: context || {}
    };
    State.alerts.unshift(alert);
    StorageManager.put('alerts', Object.assign({id: alert.alert_id}, alert));
    EventBus.emit('alert:created', alert);
    if (State.config.notifyAlert){
      this.push(severity === 'critical' || severity === 'high' ? 'warning' : 'info',
        'Alert: ' + Utils.titleCase(severity), message);
    }
    return alert;
  },
  /** Critical alerts require a typed acknowledgement. */
  acknowledge(alert){
    Modal.prompt({
      title: 'Acknowledge critical alert',
      body: Utils.t('ackWarning') + '\n\n' + alert.message,
      confirmWord: 'ACKNOWLEDGE',
      onConfirm: () => {
        alert.status = 'acknowledged';
        alert.acknowledgedAt = Date.now();
        StorageManager.put('alerts', Object.assign({id: alert.alert_id}, alert));
        EventBus.emit('alert:acknowledged', alert);
        Toast.show('success','Alert acknowledged', alert.message.slice(0,90));
      }
    });
  }
};

/* ═══════════════ MODULE 22: MODAL ═══════════════ */
const Modal = {
  _stack: [], _lastFocus: null,
  /** Open a modal. @param {{title:string,body:Node|string,footer?:Node[],wide?:boolean,onClose?:Function}} o */
  open(o){
    const root = document.getElementById('modal-root');
    if (!root) return null;
    this._lastFocus = document.activeElement;

    const dialog = Utils.el('div', {class:'modal' + (o.wide ? ' wide' : ''), role:'dialog',
      'aria-modal':'true', 'aria-label': o.title || 'Dialog'});
    dialog.appendChild(Utils.el('div', {class:'modal-head'}, [
      Utils.el('h3', {text: o.title || ''}),
      Utils.el('button', {class:'icon-btn', 'aria-label': Utils.t('close'),
        onclick:() => this.close()}, [Icons.svg('x')])
    ]));
    const bodyWrap = Utils.el('div', {class:'modal-body'});
    if (typeof o.body === 'string'){
      String(o.body).split('\n').forEach(line =>
        bodyWrap.appendChild(Utils.el('p', {class:'muted t-sm', style:'margin-bottom:.5rem', text: line})));
    } else if (o.body){ bodyWrap.appendChild(o.body); }
    dialog.appendChild(bodyWrap);
    if (o.footer && o.footer.length) dialog.appendChild(Utils.el('div', {class:'modal-foot'}, o.footer));

    const backdrop = Utils.el('div', {class:'modal-backdrop', onclick: e => {
      if (e.target === backdrop) this.close();
    }}, [dialog]);
    root.appendChild(backdrop);
    this._stack.push({backdrop, onClose:o.onClose});

    // Focus trap
    const focusables = () => Utils.$$('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])', dialog)
      .filter(el => !el.disabled && el.offsetParent !== null);
    const onKey = e => {
      if (e.key === 'Escape'){ e.preventDefault(); this.close(); return; }
      if (e.key !== 'Tab') return;
      const f = focusables(); if (!f.length) return;
      const first = f[0], last = f[f.length-1];
      if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    };
    backdrop.addEventListener('keydown', onKey);
    setTimeout(() => { const f = focusables(); (f[1] || f[0])?.focus(); }, 30);
    EventBus.emit('ui:modal:opened', {title: o.title});
    AudioEngine.play('click');
    return dialog;
  },
  close(){
    const top = this._stack.pop();
    if (!top) return;
    top.backdrop.remove();
    try { top.onClose && top.onClose(); } catch(err){ Logger.warn('modal onClose threw', err); }
    if (this._lastFocus && this._lastFocus.focus) this._lastFocus.focus();
    EventBus.emit('ui:modal:closed', {});
  },
  closeAll(){ while (this._stack.length) this.close(); },
  /** Yes/no confirmation. */
  confirm(o){
    return this.open({
      title: o.title || Utils.t('confirm'),
      body: o.body || '',
      footer: [
        Utils.el('button', {class:'btn', onclick:() => this.close(), text: Utils.t('cancel')}),
        Utils.el('button', {class:'btn ' + (o.danger ? 'btn-danger' : 'btn-primary'),
          onclick:() => { this.close(); o.onConfirm && o.onConfirm(); },
          text: o.confirmLabel || Utils.t('confirm')})
      ]
    });
  },
  /** Confirmation requiring the user to type an exact word. */
  prompt(o){
    const input = Utils.el('input', {class:'input mono', id:'modal-confirm-input',
      placeholder: o.confirmWord, autocomplete:'off', 'aria-label':'Type ' + o.confirmWord + ' to confirm'});
    const err = Utils.el('div', {class:'field-error', role:'alert', style:'min-height:1.2em'});
    const go = () => {
      if (input.value.trim() !== o.confirmWord){
        err.textContent = 'You must type ' + o.confirmWord + ' exactly.';
        input.setAttribute('aria-invalid','true');
        AudioEngine.play('error');
        return;
      }
      this.close(); o.onConfirm && o.onConfirm();
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    const body = Utils.el('div', {class:'stack'}, [
      Utils.el('p', {class:'muted t-sm', text: o.body || ''}),
      Utils.el('div', {class:'field'}, [
        Utils.el('label', {for:'modal-confirm-input', text:'Confirmation'}), input, err
      ])
    ]);
    return this.open({
      title: o.title || Utils.t('confirm'), body,
      footer: [
        Utils.el('button', {class:'btn', onclick:() => this.close(), text: Utils.t('cancel')}),
        Utils.el('button', {class:'btn btn-danger', onclick:go, text: o.confirmLabel || Utils.t('confirm')})
      ]
    });
  }
};

/* ═══════════════ MODULE 23: CHART ENGINE ═══════════════ */
const ChartEngine = {
  get available(){ return typeof window.Chart !== 'undefined'; },

  /** Theme-aware Chart.js defaults, recomputed whenever the theme changes. */
  palette(){
    const cs = getComputedStyle(document.documentElement);
    const read = (n, fb) => (cs.getPropertyValue(n) || '').trim() || fb;
    return {
      text: read('--text-tertiary','#7a8090'),
      grid: read('--border-subtle','rgba(255,255,255,.055)'),
      border: read('--border-default','rgba(255,255,255,.09)'),
      surface: read('--bg-overlay','#1c2029'),
      accent: read('--accent','#5e6ad2'),
      win: read('--success','#3fb950'),
      loss: read('--danger','#f0553f'),
      draw: read('--warning','#d29922'),
      colors: [read('--viz-1','#5e6ad2'), read('--viz-2','#3fb1c8'), read('--viz-3','#3fb950'),
               read('--viz-4','#d29922'), read('--viz-5','#f0553f'), read('--viz-6','#a371f7')]
    };
  },
  /** Shared axis/legend/tooltip styling so every chart reads as one family. */
  axes(opts){
    const p = this.palette();
    const o = opts || {};
    return {
      legend:{position:'top', align:'end',
        labels:{usePointStyle:true, pointStyle:'circle', boxWidth:6, boxHeight:6,
                padding:14, color:p.text, font:{size:11}}},
      tooltip:{
        backgroundColor:p.surface, borderColor:p.border, borderWidth:1,
        titleColor:read0(), bodyColor:p.text, padding:10, cornerRadius:8,
        displayColors:true, boxWidth:7, boxHeight:7, boxPadding:4,
        titleFont:{size:12, weight:'600'}, bodyFont:{size:11}
      },
      grid:{color:p.grid, drawTicks:false},
      ticks:{color:p.text, font:{size:10}, padding:8},
      _p:p, _o:o
    };
    function read0(){
      return (getComputedStyle(document.documentElement)
        .getPropertyValue('--text-primary') || '').trim() || '#eceef2';
    }
  },
  applyDefaults(){
    if (!this.available) return;
    const p = this.palette();
    Chart.defaults.color = p.text;
    Chart.defaults.borderColor = p.grid;
    Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
    Chart.defaults.font.size = 11;
    // Chart.js's animator reads internal descriptors off the default animation object.
    // Replacing that object wholesale strips them and throws "this._fn is not a function"
    // on the first tick, so keep the pristine object and only toggle/tune it.
    if (this._animDefaults === undefined) this._animDefaults = Chart.defaults.animation;
    const animate = State.config.animations && !Utils.reducedMotion();
    if (!animate){
      Chart.defaults.animation = false;
    } else {
      Chart.defaults.animation = this._animDefaults;
      if (Chart.defaults.animation && typeof Chart.defaults.animation === 'object'){
        Chart.defaults.animation.duration = 700;
        Chart.defaults.animation.easing = 'easeOutQuart';
      }
    }
    Chart.defaults.plugins.legend.labels.usePointStyle = true;
    Chart.defaults.plugins.legend.labels.boxWidth = 8;
    Chart.defaults.maintainAspectRatio = false;
  },
  /** Destroy an existing chart before rebuilding it (prevents canvas leaks). */
  destroy(id){
    const c = State.charts[id];
    if (c){ try { c.destroy(); } catch(_){} delete State.charts[id]; }
  },
  destroyAll(){ Object.keys(State.charts).forEach(id => this.destroy(id)); },

  /** Create a chart, or render an accessible table fallback if Chart.js is missing.
   * @param {string} canvasId @param {Object} cfg @param {Object} [fallback] */
  make(canvasId, cfg, fallback){
    const el = document.getElementById(canvasId);
    if (!el) { Logger.warn('chart canvas not found: #' + canvasId); return null; }
    if (!this.available){ this.renderFallback(el, fallback || cfg); return null; }
    this.destroy(canvasId);
    try {
      const plugins = [];
      if (window.ChartDataLabels && cfg.useDataLabels) plugins.push(window.ChartDataLabels);
      const chart = new Chart(el.getContext('2d'), Object.assign({plugins}, cfg));
      State.charts[canvasId] = chart;
      return chart;
    } catch(err){
      ErrorBoundary.handle({type:'CHART:'+canvasId, err});
      this.renderFallback(el, fallback || cfg);
      return null;
    }
  },
  /** Accessible table replacement used when Chart.js fails to load. */
  renderFallback(canvas, cfg){
    const wrap = canvas.parentElement; if (!wrap) return;
    const labels = cfg?.data?.labels || [];
    const sets = cfg?.data?.datasets || [];
    const box = Utils.el('div', {class:'chart-fallback'});
    const table = Utils.el('table', {class:'data', style:'width:100%'});
    const thead = Utils.el('thead', {}, [Utils.el('tr', {}, [Utils.el('th', {text:'Label'})].concat(
      sets.map(s => Utils.el('th', {text: s.label || 'Value'}))))]);
    const tbody = Utils.el('tbody');
    labels.forEach((l, i) => {
      tbody.appendChild(Utils.el('tr', {}, [Utils.el('td', {text: String(l)})].concat(
        sets.map(s => Utils.el('td', {text: String(s.data?.[i] ?? '—')})))));
    });
    table.appendChild(thead); table.appendChild(tbody);
    box.appendChild(Utils.el('p', {class:'t-xs c-warn', style:'margin-bottom:.5rem',
      text:'Chart library unavailable — showing data table.'}));
    box.appendChild(table);
    canvas.replaceWith(box);
  },
  /** Download a rendered chart as a PNG. @param {string} id @param {string} name */
  toPNG(id, name){
    const chart = State.charts[id];
    const canvas = document.getElementById(id);
    try {
      const url = chart ? chart.toBase64Image() : canvas?.toDataURL('image/png');
      if (!url) throw new Error('No canvas to export');
      const a = Utils.el('a', {href:url, download:(name || id) + '.png'});
      document.body.appendChild(a); a.click(); a.remove();
      Toast.show('success','Chart exported', (name || id) + '.png');
    } catch(err){
      Logger.error('chart PNG export failed', err);
      Toast.show('error','Export failed','Could not render this chart to PNG.');
    }
  },
  /** Vertical gradient fill helper for area charts. */
  gradient(ctx, hex){
    try {
      const g = ctx.createLinearGradient(0,0,0,260);
      g.addColorStop(0, hex + '66'); g.addColorStop(1, hex + '05');
      return g;
    } catch(_){ return hex + '33'; }
  },
  /** Render a tiny inline sparkline into a KPI card. */
  spark(canvasId, values, color){
    if (!this.available) return null;
    return this.make(canvasId, {
      type:'line',
      data:{labels: values.map((_,i) => i+1),
        datasets:[{data: values, borderColor: color, borderWidth:2, pointRadius:0,
          tension:.4, fill:true,
          backgroundColor: ctx => this.gradient(ctx.chart.ctx, color)}]},
      options:{responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}, tooltip:{enabled:false}},
        scales:{x:{display:false}, y:{display:false}},
        elements:{line:{borderJoinStyle:'round'}}}
    });
  }
};

/* ═══════════════ MODULE 24: EXPORT MANAGER ═══════════════ */
const ExportManager = {
  stamp(){ return new Date().toISOString().replace(/[:.]/g,'-').slice(0,19); },

  /** RFC-4180 CSV with a UTF-8 BOM so Excel opens it correctly.
   * @param {Object[]} rows @param {string} name */
  csv(rows, name){
    try {
      if (!rows || !rows.length){ Toast.show('warning','Nothing to export','No rows match the current filters.'); return false; }
      const cols = Object.keys(rows[0]);
      const escape = v => {
        const s = v === null || v === undefined ? '' : String(v);
        return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
      };
      let out;
      if (window.Papa && Papa.unparse){
        out = Papa.unparse(rows, {columns: cols, newline:'\r\n'});
      } else {
        out = cols.join(',') + '\r\n' +
          rows.map(r => cols.map(c => escape(r[c])).join(',')).join('\r\n');
      }
      // Leading BOM so Excel detects UTF-8 rather than the system codepage.
      const ok = Utils.download((name||'rps-export') + '-' + this.stamp() + '.csv', '﻿' + out,
        'text/csv;charset=utf-8');
      if (ok){ this.record('csv', name, rows.length); }
      return ok;
    } catch(err){ ErrorBoundary.handle({type:'EXPORT:CSV', err}); return false; }
  },

  /** Schema-documented, pretty-printed JSON. */
  json(payload, name){
    try {
      const doc = {
        schema:'rps-arena/export/v1',
        app: CONFIG.app.name, version: CONFIG.app.version,
        exported_at: new Date().toISOString(),
        record_count: Array.isArray(payload) ? payload.length : undefined,
        data: payload
      };
      const ok = Utils.download((name||'rps-export') + '-' + this.stamp() + '.json',
        JSON.stringify(doc, null, 2), 'application/json;charset=utf-8');
      if (ok) this.record('json', name, Array.isArray(payload) ? payload.length : 1);
      return ok;
    } catch(err){ ErrorBoundary.handle({type:'EXPORT:JSON', err}); return false; }
  },

  /** Paginated PDF report with an executive summary and embedded charts. */
  pdf(opts){
    const o = Object.assign({title:'RPS Arena Report', rows:[], columns:null,
      summary:[], charts:[], name:'rps-report'}, opts || {});
    const jsPDFCtor = window.jspdf?.jsPDF || window.jsPDF;
    if (!jsPDFCtor){
      Toast.show('warning','PDF unavailable','jsPDF failed to load — exporting CSV instead.');
      return this.csv(o.rows, o.name);
    }
    try {
      const doc = new jsPDFCtor({orientation:'p', unit:'pt', format:'a4'});
      const W = doc.internal.pageSize.getWidth();
      let y = 56;

      doc.setFillColor(99,102,241); doc.rect(0,0,W,8,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(20,20,30);
      doc.text(o.title, 40, y); y += 20;
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(110,110,130);
      doc.text('Generated ' + new Date().toLocaleString() + '  ·  ' + CONFIG.app.name + ' v' + CONFIG.app.version, 40, y);
      y += 26;

      if (o.summary.length){
        doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(20,20,30);
        doc.text('Executive summary', 40, y); y += 16;
        doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(60,60,80);
        o.summary.forEach(line => {
          const wrapped = doc.splitTextToSize('•  ' + line, W - 80);
          doc.text(wrapped, 44, y); y += wrapped.length * 13;
        });
        y += 12;
      }

      o.charts.forEach(cid => {
        const chart = State.charts[cid];
        if (!chart) return;
        try {
          const img = chart.toBase64Image();
          if (y > 520){ doc.addPage(); y = 56; }
          doc.addImage(img, 'PNG', 40, y, W - 80, 190);
          y += 208;
        } catch(err){ Logger.warn('chart embed failed', cid, err); }
      });

      if (o.rows.length && doc.autoTable){
        const cols = o.columns || Object.keys(o.rows[0]);
        if (y > 600){ doc.addPage(); y = 56; }
        doc.autoTable({
          startY: y,
          head: [cols],
          body: o.rows.slice(0, 400).map(r => cols.map(c => String(r[c] ?? ''))),
          styles:{fontSize:8, cellPadding:4},
          headStyles:{fillColor:[99,102,241], textColor:255, fontStyle:'bold'},
          alternateRowStyles:{fillColor:[245,246,252]},
          margin:{left:40, right:40}
        });
      } else if (o.rows.length){
        doc.setFontSize(9);
        o.rows.slice(0,40).forEach(r => {
          if (y > 780){ doc.addPage(); y = 56; }
          doc.text(Object.values(r).join('  |  ').slice(0,110), 40, y); y += 12;
        });
      }

      const pages = doc.internal.getNumberOfPages();
      for (let i = 1; i <= pages; i++){
        doc.setPage(i);
        doc.setFontSize(8); doc.setTextColor(140,140,160);
        doc.text('Page ' + i + ' of ' + pages, W - 90, doc.internal.pageSize.getHeight() - 24);
        doc.text(CONFIG.app.name, 40, doc.internal.pageSize.getHeight() - 24);
      }
      doc.save(o.name + '-' + this.stamp() + '.pdf');
      this.record('pdf', o.name, o.rows.length);
      Toast.show('success','PDF exported', o.title);
      return true;
    } catch(err){
      ErrorBoundary.handle({type:'EXPORT:PDF', err});
      Toast.show('error','PDF export failed','Falling back to CSV.');
      return this.csv(o.rows, o.name);
    }
  },

  /** Keep the last 10 export operations for the profile page. */
  record(format, name, count){
    const list = StorageManager.get(LS.reports, []) || [];
    list.unshift({id: Utils.uuid(), format, name: name || 'export', count: count || 0, at: Date.now()});
    StorageManager.set(LS.reports, list.slice(0,10));
    AchievementSystem.flag('exported');
    AchievementSystem.evaluate();
    EventBus.emit('export:done', {format, name});
    Repository.audit('export', {format, name, count});
  },
  history(){ return StorageManager.get(LS.reports, []) || []; }
};

/* ═══════════════ MODULE 25: SEARCH ENGINE ═══════════════ */
const SearchEngine = {
  index: null, corpus: [],
  /** Build a unified search corpus over matches, players and achievements. */
  build(){
    this.corpus = [];
    State.matches.slice(0, 800).forEach(m => this.corpus.push({
      type:'match', id:m.id, title:m.id + ' — ' + Utils.titleCase(m.result),
      subtitle: Utils.titleCase(m.difficulty) + ' · ' + Utils.titleCase(m.mode) + ' · ' +
        m.playerScore + '–' + m.aiScore, icon: Icons.outcome(m.result),
      route:'#/history', keywords: [m.id, m.result, m.difficulty, m.mode].join(' ')
    }));
    State.leaderboard.forEach(p => this.corpus.push({
      type:'player', id:p.id, title:p.name,
      subtitle:'Rank #' + p.rank + ' · ' + Utils.pct(p.winRate) + ' win rate',
      icon:'users', route:'#/leaderboard', keywords:[p.name, p.id, 'player', 'rank'].join(' ')
    }));
    ACHIEVEMENTS.forEach(a => this.corpus.push({
      type:'achievement', id:a.id, title:a.name,
      subtitle:a.desc + ' · ' + a.rarity, icon:a.icon, route:'#/profile',
      keywords:[a.name, a.desc, a.rarity, 'achievement'].join(' ')
    }));
    [['dashboard','dashboard'],['play','play'],['analytics','analytics'],['history','history'],
     ['leaderboard','leaderboard'],['settings','settings'],['profile','profile'],['help','help']].forEach(([r,ic]) =>
      this.corpus.push({type:'page', id:r, title: Utils.t(r), subtitle:'Go to page',
        icon:ic, route:'#/'+r, keywords:r}));

    if (window.Fuse){
      try {
        this.index = new Fuse(this.corpus, {
          keys:[{name:'title', weight:0.6},{name:'subtitle', weight:0.2},{name:'keywords', weight:0.2}],
          threshold:0.36, ignoreLocation:true, minMatchCharLength:2
        });
      } catch(err){ Logger.warn('Fuse init failed', err); this.index = null; }
    } else { this.index = null; }
    Logger.info('search index built —', this.corpus.length, 'documents',
      this.index ? '(fuzzy)' : '(substring fallback)');
  },
  /** @param {string} q @param {number} [limit] @returns {Object[]} */
  query(q, limit){
    const s = Utils.sanitize(q, 60).toLowerCase();
    if (s.length < 2) return [];
    const n = limit || 12;
    if (this.index){
      try { return this.index.search(s, {limit:n}).map(r => r.item); }
      catch(err){ Logger.warn('fuse search failed', err); }
    }
    return this.corpus.filter(d =>
      d.title.toLowerCase().includes(s) ||
      d.subtitle.toLowerCase().includes(s) ||
      String(d.keywords).toLowerCase().includes(s)).slice(0, n);
  }
};

/* ═══════════════ MODULE 26: UNDO MANAGER ═══════════════ */
const UndoManager = {
  _undo: [], _redo: [],
  /** @param {{label:string, undo:Function, redo?:Function}} action */
  push(action){
    this._undo.push(action);
    if (this._undo.length > CONFIG.app.maxUndoSteps) this._undo.shift();
    this._redo.length = 0;
    EventBus.emit('undo:changed', this.state());
  },
  async undo(){
    const a = this._undo.pop();
    if (!a){ Toast.show('info','Nothing to undo'); return false; }
    try {
      await a.undo();
      this._redo.push(a);
      Toast.show('success','Undone', a.label);
      EventBus.emit('undo:changed', this.state());
      return true;
    } catch(err){
      ErrorBoundary.handle({type:'UNDO', err});
      Toast.show('error','Undo failed', a.label);
      return false;
    }
  },
  async redo(){
    const a = this._redo.pop();
    if (!a || !a.redo){ Toast.show('info','Nothing to redo'); return false; }
    try {
      await a.redo();
      this._undo.push(a);
      Toast.show('success','Redone', a.label);
      EventBus.emit('undo:changed', this.state());
      return true;
    } catch(err){ ErrorBoundary.handle({type:'REDO', err}); return false; }
  },
  state(){ return {canUndo: this._undo.length > 0, canRedo: this._redo.length > 0,
                   depth: this._undo.length}; },
  clear(){ this._undo.length = 0; this._redo.length = 0; }
};

/* ═══════════════ MODULE 27: THEME MANAGER ═══════════════ */
const ThemeManager = {
  apply(theme){
    const t = CONFIG.ui.themes.includes(theme) ? theme : CONFIG.ui.defaultTheme;
    State.config.theme = t;
    document.documentElement.setAttribute('data-theme', t);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'light' ? '#ffffff' : t === 'contrast' ? '#000000' : '#08090b');
    const btn = document.getElementById('btn-theme');
    if (btn) Icons.set(btn, {dark:'moon', light:'sun', contrast:'contrast'}[t] || 'moon');
    ChartEngine.applyDefaults();
    Object.keys(State.charts).forEach(id => { try { State.charts[id].update(); } catch(_){} });
    EventBus.emit('ui:theme:changed', {theme:t});
    return t;
  },
  cycle(){
    const i = CONFIG.ui.themes.indexOf(State.config.theme);
    const next = CONFIG.ui.themes[(i + 1) % CONFIG.ui.themes.length];
    this.apply(next);
    ConfigManager.save();
    Toast.show('info','Theme: ' + Utils.titleCase(next));
    AudioEngine.play('select');
  },
  /** Recolour the brand tokens from a user-picked accent. */
  setAccent(hex){
    if (!/^#[0-9a-f]{6}$/i.test(hex)) return false;
    State.config.accent = hex;
    const r = document.documentElement;
    r.style.setProperty('--brand-500', hex);
    r.style.setProperty('--brand-400', this.shade(hex, 22));
    r.style.setProperty('--brand-600', this.shade(hex, -18));
    r.style.setProperty('--border-focus', hex);
    r.style.setProperty('--grad-brand', 'linear-gradient(135deg,' + hex + ' 0%,' +
      this.shade(hex, -12) + ' 50%, var(--cyan) 100%)');
    ConfigManager.save();
    return true;
  },
  /** Lighten (+) or darken (−) a hex colour by a percentage. */
  shade(hex, pct){
    const n = parseInt(hex.slice(1), 16);
    const f = (v) => Utils.clamp(Math.round(v + (pct/100)*255), 0, 255);
    const r = f((n>>16)&255), g = f((n>>8)&255), b = f(n&255);
    return '#' + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);
  },
  applyLanguage(lang){
    const l = TRANSLATIONS[lang] ? lang : CONFIG.ui.defaultLang;
    State.config.lang = l;
    document.documentElement.setAttribute('lang', l);
    document.documentElement.setAttribute('dir', RTL_LANGS.includes(l) ? 'rtl' : 'ltr');
    Utils.$$('[data-i18n]').forEach(el => { el.textContent = Utils.t(el.getAttribute('data-i18n')); });
    EventBus.emit('ui:lang:changed', {lang:l});
    return l;
  },
  applyDisplay(){
    const r = document.documentElement;
    r.style.setProperty('--font-scale', String(State.config.fontScale));

/* ═══════════════ CONFIG MANAGER ═══════════════ */
const ConfigManager = {
  load(){
    const saved = StorageManager.get(LS.config, null);
    State.config = saved ? Utils.deepMerge(DEFAULT_CONFIG, saved) : Utils.clone(DEFAULT_CONFIG);
    return State.config;
  },
  save(){
    StorageManager.set(LS.config, State.config);
    EventBus.emit('settings:changed', {config: State.config});
  },
  /** @param {string} key @param {*} value */
  set(key, value){
    State.config[key] = value;
    this.save();
    EventBus.emit('settings:changed', {key, value});
  },
  reset(){
    State.config = Utils.clone(DEFAULT_CONFIG);
    this.save();
    ThemeManager.apply(State.config.theme);
    ThemeManager.applyLanguage(State.config.lang);
    ThemeManager.applyDisplay();
  },
  exportFile(){ ExportManager.json(State.config, 'rps-settings'); },
  /** Import a settings JSON file. @param {File} file */
  importFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        const incoming = parsed?.data && typeof parsed.data === 'object' ? parsed.data : parsed;
        State.config = Utils.deepMerge(DEFAULT_CONFIG, incoming);
        this.save();
        ThemeManager.apply(State.config.theme);
        ThemeManager.applyLanguage(State.config.lang);
        ThemeManager.applyDisplay();
        Toast.show('success','Settings imported','Your preferences have been restored.');
        Router.reload();
      } catch(err){
        ErrorBoundary.handle({type:'IMPORT:CONFIG', err});
        Toast.show('error','Import failed','That file is not valid settings JSON.');
      }
    };
    reader.onerror = () => Toast.show('error','Import failed','Could not read the file.');
    reader.readAsText(file);
  }
};

/* ═══════════════ MODULE 28: AUTH MANAGER ═══════════════ */
const AuthManager = {
  failures: 0, lockedUntil: 0, _lastActivity: Date.now(), _warned: false,

  /** Trivial reversible obfuscation — this is a local-only demo session, not real crypto. */
  encode(obj){
    try {
      const json = JSON.stringify(obj);
      let out = '';
      for (let i = 0; i < json.length; i++) out += String.fromCharCode(json.charCodeAt(i) ^ 0x5A);
      return btoa(unescape(encodeURIComponent(out)));
    } catch(_){ return null; }
  },
  decode(token){
    try {
      const raw = decodeURIComponent(escape(atob(token)));
      let out = '';
      for (let i = 0; i < raw.length; i++) out += String.fromCharCode(raw.charCodeAt(i) ^ 0x5A);
      return JSON.parse(out);
    } catch(_){ return null; }
  },
  /** Restore a stored session if the token is still valid. @returns {?Object} */
  restore(){
    const token = StorageManager.get(LS.session, null);
    if (!token) return null;
    const s = this.decode(token);
    if (!s || !s.name || !s.expires){ StorageManager.remove(LS.session); return null; }
    if (Date.now() > s.expires){
      StorageManager.remove(LS.session);
      Logger.info('session expired');
      return null;
    }
    State.user = s;
    this._lastActivity = Date.now();
    EventBus.emit('auth:login', s);
    return s;
  },
  /** Create a local session. @param {string} name @param {Object} [opts] */
  login(name, opts){
    const v = Validator.playerName(name);
    if (!v.ok){ Toast.show('error','Invalid name', v.error); return null; }
    if (Date.now() < this.lockedUntil){
      Toast.show('error','Locked out','Too many attempts. Try again shortly.');
      return null;
    }
    const o = opts || {};
    const user = {
      id: State.user?.id || Utils.uuid(),
      name: v.value,
      email: o.email ? (Validator.email(o.email).value || '') : (State.user?.email || ''),
      avatar: o.avatar || State.user?.avatar || null,
      bio: Utils.sanitize(o.bio ?? State.user?.bio ?? '', 160),
      role: o.role || State.user?.role || 'user',
      createdAt: State.user?.createdAt || Date.now(),
      expires: Date.now() + (o.remember ? 7*86400000 : CONFIG.ui.sessionTimeoutMs),
      remember: !!o.remember
    };
    State.user = user;
    StorageManager.set(LS.session, this.encode(user));
    this._lastActivity = Date.now(); this._warned = false; this.failures = 0;
    EventBus.emit('auth:login', user);
    Repository.audit('login', {name: user.name, role: user.role});
    return user;
  },
  /** Update the current profile in place. */
  update(patch){
    if (!State.user) return null;
    const next = Object.assign({}, State.user, patch || {});
    if (patch?.name){
      const v = Validator.playerName(patch.name);
      if (!v.ok){ Toast.show('error','Invalid name', v.error); return null; }
      next.name = v.value;
    }
    if (patch?.bio !== undefined) next.bio = Validator.bio(patch.bio).value;
    State.user = next;
    StorageManager.set(LS.session, this.encode(next));
    EventBus.emit('auth:updated', next);
    return next;
  },
  logout(){
    Repository.audit('logout', {name: State.user?.name});
    State.user = null;
    StorageManager.remove(LS.session);
    EventBus.emit('auth:logout', {});
    Toast.show('info','Signed out','Your local data is preserved.');
    Router.go('#/dashboard');
  },
  /** Role gate used to hide destructive controls from viewers. */
  can(capability){
    const role = State.user?.role || 'user';
    const matrix = {
      admin:  ['view','play','export','delete','reset','settings','audit'],
      user:   ['view','play','export','delete','settings'],
      viewer: ['view','export']
    };
    return (matrix[role] || matrix.user).includes(capability);
  },
  touch(){ this._lastActivity = Date.now(); this._warned = false; },
  /** Inactivity watchdog — warns 5 minutes before expiry. */
  watch(){
    if (!State.user || State.user.remember) return;
    const idle = Date.now() - this._lastActivity;
    const remaining = CONFIG.ui.sessionTimeoutMs - idle;
    if (remaining <= 0){
      EventBus.emit('auth:expired', {});
      Toast.show('warning','Session expired','You have been signed out after 30 minutes idle.');
      this.logout();
      return;
    }
    if (remaining <= CONFIG.ui.sessionWarnMs && !this._warned){
      this._warned = true;
      Modal.confirm({
        title:'Still there?',
        body:'Your session expires in ' + Math.ceil(remaining/60000) + ' minutes. Stay signed in?',
        confirmLabel:'Stay signed in',
        onConfirm: () => { this.touch(); this.login(State.user.name, State.user); }
      });
    }
  }
};

/* ═══════════════ MODULE 29: ROUTER ═══════════════ */
const Router = {
  routes: ['dashboard','play','analytics','history','leaderboard','settings','profile','help'],
  current: null,

  init(){
    window.addEventListener('hashchange', () => this.resolve());
    this.resolve();
  },
  /** @param {string} hash */
  go(hash){
    if (location.hash === hash) this.resolve();
    else location.hash = hash;
  },
  reload(){ this.resolve(true); },
  parse(){
    const raw = (location.hash || CONFIG.app.defaultRoute).replace(/^#\/?/,'');
    const [name, ...rest] = raw.split('/');
    return {name: this.routes.includes(name) ? name : 'dashboard', params: rest};
  },
  resolve(force){
    const {name, params} = this.parse();
    if (!force && name === this.current) return;
    const from = this.current;

    // Tear down the previous page cleanly (charts, timers, listeners).
    if (from && Pages[from]?.destroy){
      try { Pages[from].destroy(); } catch(err){ Logger.warn('destroy failed for', from, err); }
    }
    ChartEngine.destroyAll();

    this.current = name;
    State.route = name;
    const view = document.getElementById('main-content');
    if (!view){ Logger.error('main view missing'); return; }
    view.textContent = '';

    try {
      const page = Pages[name] || Pages.dashboard;
      const node = page.render(params);
      if (node) view.appendChild(node);
      if (page.mount) page.mount(params);
    } catch(err){
      ErrorBoundary.handle({type:'ROUTE:'+name, err});
      view.appendChild(Utils.el('div', {class:'card'}, [
        Utils.el('h3', {text:'This page failed to render'}),
        Utils.el('p', {class:'muted t-sm', style:'margin-top:.5rem',
          text:'The error has been logged. Try reloading or returning to the dashboard.'}),
        Utils.el('button', {class:'btn btn-primary mt-4', onclick:() => Router.go('#/dashboard'),
          text:'Back to dashboard'})
      ]));
    }

    // Choreograph the new page: stagger top-level sections, then wire pointer physics.
    Motion.stagger(view);
    Motion.observe(view);
    Motion.enhance(view);
    Icons.hydrate(view);

    UIController.setActiveNav(name);
    AchievementSystem.markVisited(name);
    AchievementSystem.evaluate();
    view.focus({preventScroll:true});
    window.scrollTo({top:0, behavior: Utils.reducedMotion() ? 'auto' : 'smooth'});
    EventBus.emit('ui:route:changed', {from, to:name});
    if (window.lucide?.createIcons){ try { lucide.createIcons(); } catch(_){} }
  }
};

  /** Deterministic identity chip: gradient derived from the name, monogram on top.
   * @param {string} name @param {?string} paletteId @param {'sm'|'lg'|'xl'} [size] */
  avatar(name, paletteId, size){
    const safe = Utils.sanitize(name || '?', 24) || '?';
    const pal = CONFIG.ui.avatarPalettes;
    let p = paletteId && pal.find(x => x.id === paletteId);
    if (!p){
      // FNV-style hash so the same name always yields the same colour.
      let h = 2166136261;
      for (let i = 0; i < safe.length; i++){ h ^= safe.charCodeAt(i); h = Math.imul(h, 16777619); }
      p = pal[Math.abs(h) % pal.length];
    }
    const initials = safe.replace(/[^\p{L}\p{N}]+/gu,' ').trim().split(/\s+/)
      .slice(0,2).map(w => w[0]).join('').toUpperCase() || safe[0].toUpperCase();
    const node = Utils.el('span', {class:'avatar' + (size && size !== 'sm' ? ' ' + size : ''),
      'aria-hidden':'true', title: safe, text: initials});
    node.style.background = 'linear-gradient(145deg,' + p.from + ',' + p.to + ')';

    return node;

  /** Paginated, sortable data table. Renders a windowed slice for large sets. */
  table(o){
    const wrap = Utils.el('div');
    const box = Utils.el('div', {class:'table-wrap'});
    const table = Utils.el('table', {class:'data'});
    const thead = Utils.el('thead');

      const th = Utils.el('th', {class: col.sortable === false ? '' : 'sortable',
        scope:'col', tabindex: col.sortable === false ? null : '0'});
      th.appendChild(document.createTextNode(col.label));
      if (col.sortable !== false){
        const isActive = o.sort === col.key;
        if (isActive) th.setAttribute('aria-sort', o.dir === 'asc' ? 'ascending' : 'descending');
        th.appendChild(Utils.el('span', {class:'arrow', 'aria-hidden':'true',
          text: isActive ? (o.dir === 'asc' ? '▲' : '▼') : '↕'}));
        const doSort = () => o.onSort && o.onSort(col.key);
        th.addEventListener('click', doSort);
        th.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); doSort(); } });
      }
      trh.appendChild(th);
    });
    thead.appendChild(trh); table.appendChild(thead);
    const tbody = Utils.el('tbody');
    if (!o.rows.length){
      tbody.appendChild(Utils.el('tr', {}, [
        Utils.el('td', {colspan: String(o.columns.length)}, [UI.empty(o.emptyMessage)])
      ]));
    } else {
      o.rows.forEach((row, i) => {
        const tr = Utils.el('tr', {class: o.highlight && o.highlight(row) ? 'me' : ''});
        o.columns.forEach(col => {
          const td = Utils.el('td');
          const v = col.render ? col.render(row, i) : row[col.key];
          if (v instanceof Node) td.appendChild(v);
          else td.textContent = v === null || v === undefined ? '—' : String(v);
          tr.appendChild(td);
        });
        if (o.onRowClick){
          tr.style.cursor = 'pointer';
          tr.addEventListener('click', () => o.onRowClick(row));
        }
        tbody.appendChild(tr);
      });
    }
    table.appendChild(tbody);
    box.appendChild(table);
    wrap.appendChild(box);
    if (o.pages > 1 || o.total > 0) wrap.appendChild(UI.pagination(o));
    return wrap;
  },
  pagination(o){
    const bar = Utils.el('div', {class:'pagination', role:'navigation', 'aria-label':'Pagination'});
    const mk = (label, page, disabled, active) => Utils.el('button', {
      class:'pg' + (active ? ' active' : ''), disabled: disabled || false,
      'aria-label':'Page ' + page, 'aria-current': active ? 'page' : null,
      onclick:() => o.onPage && o.onPage(page)}, String(label));
    bar.appendChild(Utils.el('span', {class:'t-xs dim', style:'margin-right:auto',
      text: Utils.num(o.total) + ' ' + Utils.t('rows') + ' · ' + Utils.t('page') + ' ' +
            o.page + ' ' + Utils.t('of') + ' ' + o.pages}));
    bar.appendChild(mk('«', 1, o.page <= 1));
    bar.appendChild(mk('‹', o.page - 1, o.page <= 1));
    const from = Math.max(1, Math.min(o.page - 2, o.pages - 4));
    const to = Math.min(o.pages, from + 4);
    for (let p = from; p <= to; p++) bar.appendChild(mk(p, p, false, p === o.page));
    bar.appendChild(mk('›', o.page + 1, o.page >= o.pages));
    bar.appendChild(mk('»', o.pages, o.page >= o.pages));
    return bar;
  }
};

/* ═══════════════ MODULE 31: GAME ENGINE ═══════════════ */
/**
 * Finite state machine: idle → playing → round-resolving → playing → match-over.
 * Owns the active session; all persistence flows through Repository.
 */
const GameEngine = {
  session: null, _timer: null, _tick: null, _busy: false,

  /** Begin a new match. @param {{difficulty?:string,mode?:string}} [opts] */
  start(opts){
    const o = opts || {};
    const difficulty = CONFIG.game.difficulties.includes(o.difficulty)
      ? o.difficulty : State.config.difficulty;
    const mode = CONFIG.game.modes.includes(o.mode) ? o.mode : State.config.mode;
    this.stopTimer();
    this.session = {
      id: 'M-' + Date.now().toString(36).toUpperCase(),
      difficulty, mode,
      target: CONFIG.game.targetScore[mode] || 5,
      timeoutMs: CONFIG.game.moveTimeoutMs[mode] || 0,
      playerScore: 0, aiScore: 0, draws: 0, rounds: [],
      startedAt: Date.now(), state:'playing', maxDeficit: 0,
      replayIndex: -1
    };
    State.game = this.session;
    EventBus.emit('game:started', this.session);
    Repository.audit('game:start', {difficulty, mode});
    AudioEngine.play('select');
    return this.session;
  },

  /** Resolve one round. @param {string} playerMove @returns {?Object} the round record */
  play(playerMove){
    if (!this.session || this.session.state !== 'playing') return null;
    if (this._busy) return null;
    if (!GameRules.isValid(playerMove)){ Logger.warn('illegal move rejected:', playerMove); return null; }
    if (!Validator.rateLimit()){ Toast.show('warning','Slow down','Too many actions — take a breath.'); return null; }

    this._busy = true;
    this.stopTimer();
    AuthManager.touch();

    const histBefore = this.session.rounds.slice();
    const decision = MLEngine.chooseMove(this.session.difficulty, histBefore);
    const aiMove = decision.move;
    const outcome = GameRules.judge(playerMove, aiMove);

    const round = {
      id: this.session.id + '-R' + String(this.session.rounds.length + 1).padStart(2,'0'),
      matchId: this.session.id, round: this.session.rounds.length + 1,
      playerMove, aiMove, outcome, timestamp: Date.now(),
      responseMs: Date.now() - (this._roundStarted || Date.now()),
      aiPredicted: decision.prediction?.move || null,
      aiConfidence: Number((decision.prediction?.confidence ?? 0).toFixed(3)),
      reason: decision.reason, difficulty: this.session.difficulty, anomaly:false
    };

    if (outcome === 'win') this.session.playerScore++;
    else if (outcome === 'loss') this.session.aiScore++;
    else this.session.draws++;
    this.session.maxDeficit = Math.max(this.session.maxDeficit,
      this.session.aiScore - this.session.playerScore);
    this.session.rounds.push(round);

    // Learn only after the round is committed, so the model never peeks.
    MLEngine.learn(histBefore, playerMove, outcome);

    EventBus.emit('game:round', round);
    if (State.config.notifyRound){
      NotificationManager.push('info','Round ' + round.round,
        Utils.t('you') + ' ' + playerMove + ' vs ' + Utils.t('ai') + ' ' + aiMove + ' → ' + outcome);
    }

    const over = this.session.playerScore >= this.session.target ||
                 this.session.aiScore >= this.session.target;
    if (over) this.finish();
    this._busy = false;
    return round;
  },

  /** Conclude the match, persist it and evaluate achievements. */
  async finish(){
    if (!this.session || this.session.state === 'over') return null;
    this.stopTimer();
    this.session.state = 'over';
    const s = this.session;
    const result = s.playerScore > s.aiScore ? 'win' : s.playerScore < s.aiScore ? 'loss' : 'draw';
    const predicted = s.rounds.filter(r => r.aiPredicted === r.playerMove).length;

    const match = {
      id: s.id, createdAt: s.startedAt, endedAt: Date.now(),
      difficulty: s.difficulty, mode: s.mode,
      playerScore: s.playerScore, aiScore: s.aiScore, draws: s.draws,
      rounds: s.rounds.length, result,
      durationMs: Date.now() - s.startedAt,
      accuracy: s.rounds.length ? Number((predicted / s.rounds.length).toFixed(3)) : 0,
      avgResponseMs: Math.round(Utils.mean(s.rounds.map(r => r.responseMs || 0))),
      archetype:'live', anomaly:false, synthetic:false,
      streakAfter: 0
    };

    await Repository.saveMatch(match, s.rounds);
    if (result === 'win' && s.maxDeficit >= 3) AchievementSystem.flag('comeback');
    StatsEngine.compute();
    this.updateLeaderboard(match);
    AchievementSystem.evaluate();

    EventBus.emit('game:ended', {match, result});
    Repository.audit('game:end', {id: match.id, result, score: s.playerScore + '-' + s.aiScore});

    if (result === 'win'){
      AudioEngine.play('matchWin'); AudioEngine.vibrate([40,60,40]);
      ConfettiSystem.burst();
      if (State.config.notifyMatch) NotificationManager.push('success', Utils.t('matchWon'),
        s.playerScore + '–' + s.aiScore + ' on ' + Utils.titleCase(s.difficulty));
    } else if (result === 'loss'){
      AudioEngine.play('matchLoss'); AudioEngine.vibrate(180);
      if (State.config.notifyMatch) NotificationManager.push('warning', Utils.t('matchLost'),
        s.playerScore + '–' + s.aiScore + ' on ' + Utils.titleCase(s.difficulty));
    } else {
      AudioEngine.play('draw');
    }

    // Generate a behavioural alert when the player becomes highly predictable.
    const stats = State.stats;
    if (stats && stats.rounds >= 20 && stats.predictability >= 0.28){
      NotificationManager.createAlert(
        stats.predictability >= 0.45 ? 'high' : 'medium',
        'Your throws are becoming predictable (index ' + stats.predictability.toFixed(2) + ').',
        Utils.clamp(stats.predictability + 0.4, 0, 0.99),
        'Mix in your least-used move — currently ' +
          CONFIG.game.moves.reduce((a,b) => stats.moveCounts[a] <= stats.moveCounts[b] ? a : b) + '.',
        {predictability: stats.predictability, entropy: stats.entropy, moveCounts: stats.moveCounts}
      );
    }
    return match;
  },

  /** Forfeit the current match without saving it. */
  abandon(){
    this.stopTimer();
    if (this.session) this.session.state = 'abandoned';
    this.session = null; State.game = null;
    EventBus.emit('game:abandoned', {});
  },

  /** Undo the most recent round (removes it from the live session only). */
  undoRound(){
    if (!this.session || !this.session.rounds.length || this.session.state === 'over') return false;
    const r = this.session.rounds.pop();
    if (r.outcome === 'win') this.session.playerScore--;
    else if (r.outcome === 'loss') this.session.aiScore--;
    else this.session.draws--;
    AudioEngine.play('click');
    EventBus.emit('game:undo', r);
    return true;
  },

  /** Start the per-move countdown for timed modes. @param {Function} onTick @param {Function} onExpire */
  startTimer(onTick, onExpire){
    this.stopTimer();
    this._roundStarted = Date.now();
    const limit = this.session?.timeoutMs || 0;
    if (!limit) return;
    const started = Date.now();
    this._tick = setInterval(() => {
      const elapsed = Date.now() - started;
      const remaining = Math.max(0, limit - elapsed);
      onTick && onTick(remaining / limit, remaining);
      if (remaining <= 0){
        this.stopTimer();
        onExpire && onExpire();
      } else if (remaining < 1000 && remaining % 300 < 60){
        AudioEngine.play('tick');
      }
    }, 60);
  },
  stopTimer(){
    if (this._tick){ clearInterval(this._tick); this._tick = null; }
    this._roundStarted = Date.now();
  },

  /** Insert / update the local player on the global leaderboard. */
  updateLeaderboard(match){
    const name = State.user?.name || 'You';
    const stats = State.stats || StatsEngine.compute();
    let me = State.leaderboard.find(p => p.isMe);
    if (!me){
      me = {id:'P-ME', name, avatar: State.user?.avatar || null, isMe:true,
            tier:1, synthetic:false, prevRank: State.leaderboard.length + 1};
      State.leaderboard.push(me);
    }
    me.name = name;
    me.avatar = State.user?.avatar || me.avatar;
    me.played = stats.matches;
    me.wins = stats.wins; me.losses = stats.losses; me.draws = stats.draws;
    me.winRate = Number(stats.winRate.toFixed(4));
    me.bestStreak = stats.bestStreak;
    me.score = Math.round(stats.wins * 10 + stats.draws * 3 + stats.bestStreak * 5);
    me.lastSeen = Date.now();
    State.leaderboard.sort((a,b) => b.score - a.score);
    State.leaderboard.forEach((p,i) => { p.prevRank = p.rank ?? i+1; p.rank = i + 1; });
    StorageManager.putAll('players', State.leaderboard.map(p => Utils.clone(p)));
    return me;
  },

  /** Practice-mode explanation of the AI's last decision. @returns {string} */
  explainLast(){
    const r = this.session?.rounds?.[this.session.rounds.length - 1];
    return r?.reason || 'No round has been played yet.';
  }
};

  mount(){
    this.refresh();
    // Keyboard: R/P/S and 1/2/3 throw; N starts a new match.
    this._keyHandler = e => {
      if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const move = CONFIG.game.keys[e.key.toLowerCase()];
      if (move){ e.preventDefault(); this.throw(move); return; }
      if (e.key.toLowerCase() === 'n'){ e.preventDefault(); this.newGame(); }
    };
    document.addEventListener('keydown', this._keyHandler);
    this.armTimer();
    this._unsub.push(EventBus.on('game:ended', ({match, result}) => {
      if (Router.current === 'play') Pages.play.showMatchEnd(match, result);
    }));
  },

  armTimer(){
    const g = GameEngine.session;
    if (!g || !g.timeoutMs || g.state !== 'playing') return;
    const bar = document.getElementById('timer-bar');
    GameEngine.startTimer(
      (frac) => {
        const fill = bar?.querySelector('i');
        if (fill) fill.style.width = (frac*100).toFixed(1) + '%';
        if (bar) bar.classList.toggle('danger', frac < 0.3);
      },
      () => {
        Toast.show('warning','Out of time','A random throw was played for you.');
        this.throw(CONFIG.game.moves[Math.floor(Math.random()*3)], true);
      }
    );
  },

  /** Play a move with the reveal animation. @param {string} move @param {boolean} [auto] */
  throw(move, auto){
    const g = GameEngine.session;
    if (!g || g.state !== 'playing') return;
    const pad = document.getElementById('throw-pad');
    if (pad?.dataset.busy === '1') return;
    if (pad) pad.dataset.busy = '1';

    Utils.$$('.throw-btn', pad).forEach(b => {
      b.disabled = true;
      b.classList.toggle('picked', b.dataset.move === move);
    });
    AudioEngine.play('throw');

    const pHand = document.getElementById('hand-player');
    const aHand = document.getElementById('hand-ai');
    const think = document.getElementById('ai-think');
    const banner = document.getElementById('round-banner');

    if (think){
      think.textContent = '';
      for (let i = 0; i < 5; i++) think.appendChild(Utils.el('span', {class:'bar'}));
      think.appendChild(Utils.el('span', {text: ' ' + Utils.t('thinking') + '…'}));
    }
    if (banner){ banner.className = 'round-banner'; banner.textContent = '3 · 2 · 1 …'; }
    [pHand, aHand].forEach(h => { if (h){ h.classList.remove('reveal'); h.classList.add('throwing'); } });

    const delay = (State.config.animations && !Utils.reducedMotion()) ? CONFIG.game.revealDelayMs : 0;
    setTimeout(() => {
      const round = GameEngine.play(move);
      if (!round){ if (pad) pad.dataset.busy = '0'; return; }

      if (pHand){ pHand.classList.remove('throwing'); pHand.classList.add('reveal');
        Icons.set(pHand, round.playerMove); }
      if (aHand){ aHand.classList.remove('throwing'); aHand.classList.add('reveal');
        Icons.set(aHand, round.aiMove); }
      if (think) think.textContent = '';

      if (banner){
        banner.className = 'round-banner ' + round.outcome;
        banner.textContent = round.outcome === 'win' ? Utils.t('youWin')
          : round.outcome === 'loss' ? Utils.t('youLose')
          : Utils.t('itsDraw');
      }
      AudioEngine.play(round.outcome === 'win' ? 'win' : round.outcome === 'loss' ? 'loss' : 'draw');
      AudioEngine.vibrate(round.outcome === 'win' ? 40 : round.outcome === 'loss' ? 120 : 20);

      const reason = document.getElementById('ai-reason');
      if (reason) reason.textContent = round.reason;

      Pages.play.refresh();

      if (GameEngine.session && GameEngine.session.state === 'playing'){
        Utils.$$('.throw-btn', pad).forEach(b => { b.disabled = false; b.classList.remove('picked'); });
        if (pad) pad.dataset.busy = '0';
        Pages.play.armTimer();
      } else if (pad){ pad.dataset.busy = '0'; }
    }, delay);
  },

  /** Sync scores, streak pill and the round strip. */
  refresh(){
    const g = GameEngine.session;
    if (!g) return;
    const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = String(v); };
    set('score-player', g.playerScore);
    set('score-ai', g.aiScore);
    set('pill-round', 'Round ' + (g.rounds.length + 1) + ' / ' + Utils.t('firstTo', {n:g.target}));

    let streak = 0;
    for (let i = g.rounds.length - 1; i >= 0; i--){
      if (g.rounds[i].outcome === 'win') streak++; else break;
    }
    const sp = document.getElementById('pill-streak');
    if (sp){
      sp.textContent = '';
      sp.appendChild(Icons.svg('flame'));
      sp.appendChild(Utils.el('span', {text: String(streak)}));
      sp.className = 'pill ' + (streak >= 3 ? 'ok' : '');
      // Scale is capped so a long streak reads as emphasis, not distortion.
      sp.style.transform = 'scale(' + (1 + Math.min(streak, 6) * 0.03) + ')';
    }

    const strip = document.getElementById('strip');
    if (strip){
      strip.textContent = '';
      if (!g.rounds.length) strip.appendChild(Utils.el('span', {class:'t-xs dim',
        text:'No rounds played yet.'}));
      g.rounds.forEach(r => strip.appendChild(Utils.el('span', {
        class:'hs ' + r.outcome, 'data-tip':'R' + r.round + ': ' + r.playerMove + ' vs ' + r.aiMove,
        }, [GameRules.mark(r.playerMove)])));
    }
  },

  newGame(opts){
    GameEngine.start(opts);
    Router.reload();
  },

  showMatchEnd(match, result){

      Utils.el('div', {class:'result-mark ' + result, 'aria-hidden':'true'},
        [Icons.svg(result === 'win' ? 'trophy' : result === 'loss' ? 'xCircle' : 'equal')]),
      Utils.el('h2', {class: result === 'win' ? 'c-ok' : result === 'loss' ? 'c-bad' : 'c-warn',
        text: result === 'win' ? Utils.t('matchWon') : result === 'loss' ? Utils.t('matchLost') : Utils.t('itsDraw')}),

          icon:'play', text:Utils.t('newMatch')})
      ]

  /** Step-through replay of the current match. */
  openReplay(){
    const g = GameEngine.session;
    if (!g || !g.rounds.length) return Toast.show('info','Nothing to replay','Play a round first.');
    let idx = 0;
    const view = Utils.el('div', {class:'stack text-c'});
    const render = () => {
      const r = g.rounds[idx];
      view.textContent = '';
      view.appendChild(Utils.el('div', {class:'t-sm dim',
        text:'Round ' + (idx+1) + ' of ' + g.rounds.length}));
      view.appendChild(Utils.el('div', {class:'row', style:'justify-content:center;gap:2rem;font-size:3rem'}, [
        Utils.el('span', {class:'hand', style:'width:60px;height:60px'}, [GameRules.mark(r.playerMove)]),
        Utils.el('span', {class:'vs', style:'font-size:1rem', text:'VS'}),
        Utils.el('span', {class:'hand', style:'width:60px;height:60px'}, [GameRules.mark(r.aiMove)])
      ]));
      view.appendChild(UI.badge(r.outcome));
      view.appendChild(Utils.el('div', {class:'reason', style:'text-align:left', text: r.reason || '—'}));
    };
    render();
    Modal.open({
      title:'Match replay — ' + g.id, body: view, wide:true,
      footer:[
        Utils.el('button', {class:'btn', onclick:() => { idx = Math.max(0, idx-1); render(); },
          icon:'chevronLeft', text:'Previous'}),
        Utils.el('button', {class:'btn btn-primary',
          onclick:() => { idx = Math.min(g.rounds.length-1, idx+1); render(); }, text:'Next ⏭'})
      ]
    });
  },

  /** Generate a single-elimination bracket for tournament mode. */
  openTournament(){
    const rng = new SeededRNG(Date.now() & 0xffff);
    const field = [State.user?.name || 'You'].concat(
      State.leaderboard.filter(p => !p.isMe).slice(0,7).map(p => p.name));
    while (field.length < 8) field.push('Bot_' + field.length);
    rng.shuffle(field);
    const rounds = [];
    let pool = field.slice();
    while (pool.length > 1){
      const pairs = [];
      for (let i = 0; i < pool.length; i += 2) pairs.push([pool[i], pool[i+1]]);
      rounds.push(pairs);
      pool = pairs.map(p => rng.bool(0.5) ? p[0] : p[1]);
    }
    const wrap = Utils.el('div', {class:'grid', style:'grid-template-columns:repeat(' +
      rounds.length + ',minmax(0,1fr));gap:1rem'});
    rounds.forEach((pairs, ri) => {
      const col = Utils.el('div', {class:'stack'});
      col.appendChild(Utils.el('div', {class:'kpi-label',
        text: ri === rounds.length-1 ? 'Final' : 'Round ' + (ri+1)}));
      pairs.forEach(p => col.appendChild(UI.card({body:[
        Utils.el('div', {class:'t-sm', text: p[0] || 'bye'}),
        Utils.el('div', {class:'t-xs dim', text:'vs'}),
        Utils.el('div', {class:'t-sm', text: p[1] || 'bye'})
      ]})));
      wrap.appendChild(col);
    });
    wrap.appendChild(Utils.el('div', {class:'stack'}, [
      Utils.el('div', {class:'kpi-label', text:'Champion'}),
      UI.card({body:[Utils.el('div', {class:'t-lg', style:'font-weight:700', icon:'trophy', text:pool[0]})]})
    ]));
    Modal.open({title:'Tournament bracket', body: wrap, wide:true,
      footer:[Utils.el('button', {class:'btn btn-primary',
        onclick:() => { Modal.close(); Pages.play.newGame({mode:'tournament'}); },
        text:'Play tournament mode'})]});
  },

  destroy(){
    if (this._keyHandler) document.removeEventListener('keydown', this._keyHandler);
    this._keyHandler = null;
    GameEngine.stopTimer();
    this._unsub.forEach(f => f()); this._unsub = [];
  }
};

    }
    const allLabels = StatsEngine.series(this.range).labels
      .concat(Array.from({length:14}, (_,i) => 'D+' + (i+1)));
    const actual = StatsEngine.series(this.range).points
      .map(p => p.winRate === null ? null : Number((p.winRate*100).toFixed(1)))
      .concat(Array.from({length:14}, () => null));
    const forecast = allLabels.map((_, i) =>
      i < this.range - 1 ? null : Number(Utils.clamp(intercept + slope*i, 0, 100).toFixed(1)));
    ChartEngine.make('chart-a-forecast', {
      type:'line',
      data:{labels: allLabels, datasets:[
        {label:'Actual', data: actual, borderColor: CONFIG.ui.chartColors[0],
         backgroundColor: ctx => ChartEngine.gradient(ctx.chart.ctx, CONFIG.ui.chartColors[0]),
         fill:true, tension:.35, pointRadius:0, borderWidth:2, spanGaps:true},
        {label:'Forecast', data: forecast, borderColor: CONFIG.ui.chartColors[3],
         borderDash:[7,5], fill:false, tension:.2, pointRadius:0, borderWidth:2, spanGaps:true}
      ]},
      options:{responsive:true, maintainAspectRatio:false,
        plugins:{legend: ChartEngine.axes().legend, tooltip: ChartEngine.axes().tooltip},
        scales:{y:{beginAtZero:true, max:100, ticks:{callback:v => v + '%'},
          grid:{color: ChartEngine.palette().grid}},
          x:{ticks:{maxTicksLimit:12}, grid:{display:false}}}}
    });
  },

  exportAll(){
    const s = State.stats;
    ExportManager.pdf({
      title:'RPS Arena — Analytics Report', name:'rps-analytics',
      summary:[
        'Window: last ' + this.range + ' days',
        'Move entropy ' + s.entropy.toFixed(3) + ' — predictability index ' + s.predictability.toFixed(3),
        'AI read-rate ' + Utils.pct(s.aiAccuracy) + ' against a 33.3% baseline',
        'Win-stay ' + Utils.pct(s.winStayRate) + ' / lose-shift ' + Utils.pct(s.loseShiftRate) +
          ' — both far from 33% indicate exploitable habits',
        'Strongest predictor: ' + (MLEngine.scorecard()[0]?.model || 'n/a')
      ],
      charts:['chart-a-trend','chart-a-dist','chart-a-radar','chart-a-importance','chart-a-forecast'],
      rows: MLEngine.scorecard().map(c => ({
        Model:c.model, Attempts:c.attempts, Hits:c.hits,
        Accuracy: Utils.pct(c.accuracy), Weight:c.weight
      }))
    });
  },
  destroy(){}
};

Pages.history = {
  q: {search:'', result:'all', difficulty:'all', mode:'all', sort:'createdAt', dir:'desc', page:1},
  selected: new Set(),

  render(){
    const frag = document.createDocumentFragment();
    frag.appendChild(UI.header(Utils.t('history'), 'Every match on record, filterable and exportable.', [
      Utils.el('button', {class:'btn', onclick:() => Pages.history.exportRows('csv'), icon:'download', text:'CSV'}),
      Utils.el('button', {class:'btn', onclick:() => Pages.history.exportRows('json'), icon:'download', text:'JSON'}),
      Utils.el('button', {class:'btn', onclick:() => Pages.history.exportRows('pdf'), icon:'download', text:'PDF'}),

  paint(){
    const host = document.getElementById('history-body');
