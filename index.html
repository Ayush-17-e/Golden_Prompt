/* ═══════════════ MODULE 7: STORAGE ═══════════════ */
const StorageManager = {
  _mem: new Map(), _lsOk: true, db: null, _idbOk: false,

  /**
   * Opening index.html straight from disk gives the page an opaque origin; Chrome's
   * IndexedDB then never settles its requests — no success, no error, no block event.
   * Every IDB call is therefore raced against a deadline so a silent hang degrades
   * to the localStorage/memory path instead of freezing the boot sequence.
   */
  IDB_TIMEOUT_MS: 2500,
  /** @param {Promise} promise @param {*} fallback @param {number} [ms] @returns {Promise} */
  _race(promise, fallback, ms){
    return Promise.race([
      promise,
      new Promise(resolve => setTimeout(() => {
        if (this._idbOk){
          this._idbOk = false;
          Logger.warn('IndexedDB stopped responding — switching to localStorage fallback.');
        }
        resolve(fallback);
      }, ms || this.IDB_TIMEOUT_MS))
    ]);
  },

  /** Probe localStorage; fall back to an in-memory Map when blocked. */
  init(){
    try {
      const k = '__rps_probe__';
      localStorage.setItem(k,'1'); localStorage.removeItem(k); this._lsOk = true;
    } catch(_){
      this._lsOk = false;
      Logger.warn('localStorage unavailable — using in-memory fallback.');
    }
    return this._lsOk;
  },
  /** @param {string} key @param {*} fallback @returns {*} */
  get(key, fallback){
    try {
      const raw = this._lsOk ? localStorage.getItem(key) : this._mem.get(key);
      if (raw === null || raw === undefined) return fallback;
      return JSON.parse(raw);
    } catch(err){
      Logger.warn('corrupt storage entry, discarding:', key);
      try { this._lsOk ? localStorage.removeItem(key) : this._mem.delete(key); } catch(_){}
      return fallback;
    }
  },
  /** @param {string} key @param {*} value @returns {boolean} */
  set(key, value){
    const json = (()=>{ try { return JSON.stringify(value); } catch(_){ return null; } })();
    if (json === null){ Logger.warn('unserialisable value for', key); return false; }
    try {
      if (this._lsOk) localStorage.setItem(key, json); else this._mem.set(key, json);
      return true;
    } catch(err){
      if (err && /quota/i.test(err.name + err.message)){
        Logger.warn('quota exceeded — pruning caches and retrying');
        this.prune();
        try { localStorage.setItem(key, json); return true; }
        catch(e2){ this._lsOk = false; this._mem.set(key, json); return false; }
      }
      Logger.error('storage write failed', key, err); return false;
    }
  },
  remove(key){
    try { this._lsOk ? localStorage.removeItem(key) : this._mem.delete(key); } catch(_){}
  },
  /** Drop the largest expendable caches to recover quota. */
  prune(){
    [LS.errors, LS.audit, LS.undo, LS.reports].forEach(k => this.remove(k));
  },
  /** Open IndexedDB and create every object store/index. @returns {Promise<boolean>} */
  openDB(){
    return this._race(this._openDB(), false, 3000);
  },
  _openDB(){
    return new Promise(resolve => {
      if (!('indexedDB' in window)){
        Logger.warn('IndexedDB unsupported — persisting through localStorage only.');
        return resolve(false);
      }
      let req;
      try { req = indexedDB.open(CONFIG.storage.dbName, CONFIG.storage.dbVersion); }
      catch(err){ Logger.error('indexedDB.open threw', err); return resolve(false); }

      req.onupgradeneeded = ev => {
        const db = ev.target.result;
        const mk = (name, keyPath, indexes) => {
          if (db.objectStoreNames.contains(name)) return;
          const s = db.createObjectStore(name, {keyPath});
          (indexes||[]).forEach(ix => s.createIndex(ix, ix, {unique:false}));
        };
        mk('matches','id',['result','createdAt','difficulty','mode']);
        mk('rounds','id',['matchId','timestamp','outcome','playerMove']);
        mk('alerts','id',['severity','status','createdAt']);
        mk('audit','id',['action','timestamp']);
        mk('ml_models','id',['modelType','createdAt']);
        mk('reports','id',['type','createdAt']);
        mk('players','id',['score','winRate']);
        Logger.info('IndexedDB schema created / upgraded.');
      };
      req.onsuccess = ev => {
        this.db = ev.target.result; this._idbOk = true;
        this.db.onerror = e => Logger.warn('idb error', e.target?.error);
        resolve(true);
      };
      req.onerror = () => { Logger.warn('IndexedDB open failed', req.error); resolve(false); };
      req.onblocked = () => { Logger.warn('IndexedDB blocked by another tab'); resolve(false); };
    });
  },
  /** Run a transaction against a store. @returns {Promise<*>} */
  tx(store, mode, work){
    return this._race(this._tx(store, mode, work), null);
  },
  _tx(store, mode, work){
    return new Promise(resolve => {
      if (!this._idbOk || !this.db) return resolve(null);
      let t;
      try { t = this.db.transaction(store, mode); }
      catch(err){ Logger.warn('tx failed for', store, err); return resolve(null); }
      const os = t.objectStore(store);
      let result = null;
      try { result = work(os); } catch(err){ Logger.error('tx work threw', err); }
      t.oncomplete = () => resolve(result && result.__req ? result.value : result);
      t.onerror = () => { Logger.warn('tx error', t.error); resolve(null); };
      t.onabort = () => resolve(null);
    });
  },
  /** @param {string} store @param {Object[]} items @returns {Promise<number>} written */
  async putAll(store, items){
    if (!this._idbOk) return 0;
    let written = 0;
    for (let i = 0; i < items.length; i += CONFIG.data.chunkSize){
      if (!this._idbOk) break;   // a timeout mid-loop disables IDB; stop immediately
      const chunk = items.slice(i, i + CONFIG.data.chunkSize);
      await this.tx(store, 'readwrite', os => { chunk.forEach(it => { os.put(it); written++; }); });
      await Utils.sleep(0); // yield to keep the UI responsive
    }
    return written;
  },
  /** @param {string} store @returns {Promise<Object[]>} */
  getAll(store){
    return this._race(this._getAll(store), []);
  },
  _getAll(store){
    return new Promise(resolve => {
      if (!this._idbOk || !this.db) return resolve([]);
      try {
        const t = this.db.transaction(store,'readonly');
        const req = t.objectStore(store).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      } catch(err){ Logger.warn('getAll failed', store, err); resolve([]); }
    });
  },
  count(store){
    return this._race(this._count(store), 0);
  },
  _count(store){
    return new Promise(resolve => {
      if (!this._idbOk || !this.db) return resolve(0);
      try {
        const req = this.db.transaction(store,'readonly').objectStore(store).count();
        req.onsuccess = () => resolve(req.result || 0);
        req.onerror = () => resolve(0);
      } catch(_){ resolve(0); }
    });
  },
  async put(store, item){ return this.tx(store,'readwrite', os => os.put(item)); },
  async del(store, id){ return this.tx(store,'readwrite', os => os.delete(id)); },
  async clearStore(store){ return this.tx(store,'readwrite', os => os.clear()); },
  /** Wipe every trace of the app from the browser. @returns {Promise<void>} */
  async nuke(){
    Object.values(LS).forEach(k => this.remove(k));
    if (this._idbOk && this.db){
      const stores = ['matches','rounds','alerts','audit','ml_models','reports','players'];
      for (const s of stores){ try { await this.clearStore(s); } catch(_){} }
    }
    this._mem.clear();
  }
};

/* ═══════════════ MODULE 8: SEEDED RNG (Mulberry32) ═══════════════ */
class SeededRNG {
  /** @param {number} seed */
  constructor(seed){ this.seed = seed >>> 0; this._s = seed >>> 0; }
  /** @returns {number} uniform float in [0,1) */
  next(){
    this._s = (this._s + 0x6D2B79F5) >>> 0;
    let t = this._s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  /** @param {number} min @param {number} max @returns {number} integer in [min,max] */
  int(min, max){ return Math.floor(this.next() * (max - min + 1)) + min; }
  /** @param {number} min @param {number} max @returns {number} */
  float(min, max){ return this.next() * (max - min) + min; }
  /** @param {Array} arr @returns {*} */
  pick(arr){ return arr[this.int(0, arr.length - 1)]; }
  /** @param {number} p @returns {boolean} */
  bool(p){ return this.next() < (p ?? 0.5); }
  /** Box–Muller normal deviate. @param {number} mu @param {number} sigma */
  normal(mu, sigma){
    let u = 0, v = 0;
    while (u === 0) u = this.next();
    while (v === 0) v = this.next();
    return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  /** Weighted choice. @param {Array} items @param {number[]} weights */
  weighted(items, weights){
    const total = Utils.sum(weights);
    let r = this.next() * total;
    for (let i = 0; i < items.length; i++){ r -= weights[i]; if (r <= 0) return items[i]; }
    return items[items.length - 1];
  }
  /** In-place Fisher–Yates shuffle. @param {Array} arr @returns {Array} */
  shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = this.int(0, i);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  reset(){ this._s = this.seed >>> 0; }
}

/* ═══════════════ MODULE 9: SYNTHETIC DATA GENERATOR ═══════════════ */
const NAME_FIRST = ['Nova','Kai','Rio','Zed','Ada','Lux','Rex','Mira','Onyx','Vex','Juno','Pax',
  'Echo','Sage','Ryn','Vega','Cleo','Bex','Dax','Ivy','Koda','Nyx','Orin','Piper','Quill','Rune',
  'Sol','Tess','Uma','Wren','Xan','Yuri','Zara','Blaze','Cinder','Drift','Ember','Flux'];
const NAME_LAST = ['Vortex','Striker','Prime','Nine','Storm','Blade','Ghost','Fury','Kite','Ronin',
  'Volt','Quartz','Talon','Cypher','Drake','Falcon','Hawk','Iron','Jinx','Kilo'];

const DataGenerator = {
  /**
   * Build a full synthetic corpus: matches, rounds and a global leaderboard.
   * Player behaviour is modelled per-archetype so histories look authentic
   * (biased openers, win-stay/lose-shift tendencies, cycling, streakiness).
   * @param {(pct:number,label:string)=>void} [onProgress]
   * @returns {Promise<{matches:Object[],rounds:Object[],players:Object[]}>}
   */
  async generate(onProgress){
    const rng = new SeededRNG(CONFIG.data.seed);
    const report = (p,l) => { try { onProgress && onProgress(p,l); } catch(_){} };
    const MOVES = CONFIG.game.moves;
    const now = Date.now();
    const dayMs = 86400000;
    const matches = [], rounds = [];

    report(2,'Initialising deterministic PRNG…');
    await Utils.sleep(16);

    // ── Player archetypes drive realistic, non-uniform move distributions ──
    const archetypes = [
      {name:'rock-heavy',   bias:[0.52,0.26,0.22], winStay:0.62, loseShift:0.55, cycle:0.10},
      {name:'cycler',       bias:[0.34,0.33,0.33], winStay:0.30, loseShift:0.40, cycle:0.62},
      {name:'scissor-lover',bias:[0.22,0.26,0.52], winStay:0.48, loseShift:0.50, cycle:0.14},
      {name:'balanced',     bias:[0.34,0.33,0.33], winStay:0.45, loseShift:0.45, cycle:0.20},
      {name:'copycat',      bias:[0.33,0.34,0.33], winStay:0.70, loseShift:0.65, cycle:0.08}
    ];

    const totalMatches = CONFIG.data.syntheticMatches;
    let lastPlayerMove = rng.pick(MOVES), lastOutcome = 'draw', prevRoundIdx = 0;
    let cumulativeStreak = 0;

    report(8,'Modelling player archetypes…');

    for (let m = 0; m < totalMatches; m++){
      const arche = rng.weighted(archetypes, [3,2,2,4,1]);
      // Skill trend: the player slowly improves across the 90-day window.
      const ageDays = Math.floor((1 - m / totalMatches) * CONFIG.data.syntheticDays);
      const skill = 0.40 + (1 - ageDays / CONFIG.data.syntheticDays) * 0.14; // 0.40 → 0.54
      // Seasonality: weekends and evenings see more (and looser) play.
      const ts = now - ageDays * dayMs - rng.int(0, dayMs - 1);
      const d = new Date(ts);
      const weekend = d.getDay() === 0 || d.getDay() === 6;
      const evening = d.getHours() >= 18 && d.getHours() <= 23;
      const seasonal = 1 + (weekend ? 0.12 : 0) + (evening ? 0.08 : 0);
      const anomaly = rng.next() < CONFIG.data.anomalyRate;

      const difficulty = rng.weighted(CONFIG.game.difficulties, [2,3,3,2]);
      const mode = rng.weighted(CONFIG.game.modes, [5,2,2,1]);
      const target = CONFIG.game.targetScore[mode] || 5;

      const matchId = 'M-' + String(m + 1).padStart(5,'0');
      let pScore = 0, aScore = 0, draws = 0, roundNo = 0;
      const matchRounds = [];

      while (pScore < target && aScore < target && roundNo < target * 6){
        roundNo++;
        // ── Choose the player's move from archetype + behavioural rules ──
        let move;
        const r = rng.next();
        if (r < arche.cycle){
          // Cycling: advance one step around rock → paper → scissors.
          move = MOVES[(MOVES.indexOf(lastPlayerMove) + 1) % 3];
        } else if (lastOutcome === 'win' && rng.next() < arche.winStay){
          move = lastPlayerMove;                                  // win-stay
        } else if (lastOutcome === 'loss' && rng.next() < arche.loseShift){
          move = CONFIG.game.beats[lastPlayerMove] === undefined
            ? rng.pick(MOVES)
            : MOVES[(MOVES.indexOf(lastPlayerMove) + 2) % 3];      // lose-shift
        } else {
          move = rng.weighted(MOVES, arche.bias);
        }

        // ── AI move: strength scales with the selected difficulty ──
        const aiSkill = anomaly ? 0.20
          : difficulty === 'easy' ? 0.33
          : difficulty === 'medium' ? Math.min(0.52, skill * seasonal)
          : difficulty === 'hard' ? Math.min(0.62, skill * seasonal + 0.06)
          : Math.min(0.66, skill * seasonal + 0.10);
        let aiMove;
        if (rng.next() < aiSkill) aiMove = DataGenerator.counter(move);      // AI reads player
        else if (rng.next() < 0.5) aiMove = CONFIG.game.beats[move];         // AI loses
        else aiMove = move;                                                  // draw

        const outcome = GameRules.judge(move, aiMove);
        if (outcome === 'win') pScore++; else if (outcome === 'loss') aScore++; else draws++;
        cumulativeStreak = outcome === 'win' ? cumulativeStreak + 1 : 0;

        matchRounds.push({
          id: matchId + '-R' + String(roundNo).padStart(2,'0'),
          matchId, round: roundNo, playerMove: move, aiMove, outcome,
          timestamp: ts + roundNo * rng.int(1400, 5200),
          responseMs: Math.round(Math.abs(rng.normal(1180, 420))) + 220,
          aiPredicted: rng.next() < aiSkill ? move : rng.pick(MOVES),
          aiConfidence: Number(Utils.clamp(rng.normal(aiSkill + 0.14, 0.11), 0.34, 0.97).toFixed(3)),
          difficulty, anomaly
        });
        lastPlayerMove = move; lastOutcome = outcome;
      }

      const result = pScore > aScore ? 'win' : pScore < aScore ? 'loss' : 'draw';
      const durationMs = Utils.sum(matchRounds.map(r2 => r2.responseMs)) + roundNo * 900;
      matches.push({
        id: matchId, createdAt: ts, endedAt: ts + durationMs, difficulty, mode,
        playerScore: pScore, aiScore: aScore, draws, rounds: roundNo, result,
        durationMs, archetype: arche.name, anomaly,
        accuracy: Number((matchRounds.filter(r2 => r2.aiPredicted === r2.playerMove).length / roundNo).toFixed(3)),
        avgResponseMs: Math.round(Utils.mean(matchRounds.map(r2 => r2.responseMs))),
        streakAfter: cumulativeStreak, synthetic: true
      });
      rounds.push.apply(rounds, matchRounds);

      if (m % 64 === 0){
        report(8 + Math.round((m / totalMatches) * 62), 'Simulating match ' + (m + 1) + ' / ' + totalMatches + '…');
        await Utils.sleep(0);
      }
    }

    matches.sort((a,b) => b.createdAt - a.createdAt);
    rounds.sort((a,b) => b.timestamp - a.timestamp);

    report(74,'Building global leaderboard…');
    await Utils.sleep(16);
    const players = this.generatePlayers(rng);

    report(84,'Persisting to IndexedDB…');
    return {matches, rounds, players};
  },

  /** @param {string} move @returns {string} the move that defeats `move` */
  counter(move){
    for (const k of CONFIG.game.moves) if (CONFIG.game.beats[k] === move) return k;
    return CONFIG.game.moves[0];
  },

  /** Generate a plausible global leaderboard. @param {SeededRNG} rng @returns {Object[]} */
  generatePlayers(rng){
    const list = [];
    const used = new Set();
    for (let i = 0; i < CONFIG.data.leaderboardSize; i++){
      let name;
      do { name = rng.pick(NAME_FIRST) + '_' + rng.pick(NAME_LAST); } while (used.has(name));
      used.add(name);
      // Skill decays down the ladder so ranks look earned rather than random.
      const tier = 1 - i / CONFIG.data.leaderboardSize;
      const played = rng.int(40, 30 + Math.round(tier * 520));
      const winRate = Utils.clamp(rng.normal(0.38 + tier * 0.28, 0.05), 0.18, 0.86);
      const wins = Math.round(played * winRate);
      const draws = Math.round(played * rng.float(0.08, 0.18));
      const losses = Math.max(0, played - wins - draws);
      list.push({
        id: 'P-' + String(i + 1).padStart(3,'0'),
        name, avatar: rng.pick(CONFIG.ui.avatarPalettes).id,
        played, wins, losses, draws,
        winRate: Number(winRate.toFixed(4)),
        bestStreak: Math.max(2, Math.round(rng.normal(4 + tier * 12, 3))),
        score: Math.round(wins * 10 + draws * 3 + tier * rng.int(50, 400)),
        lastSeen: Date.now() - rng.int(0, 30) * 86400000,
        tier: Math.max(1, Math.ceil((1 - i / CONFIG.data.leaderboardSize) * 4)),
        synthetic: true
      });
    }
    list.sort((a,b) => b.score - a.score);
    list.forEach((p,i) => { p.rank = i + 1; p.prevRank = i + 1 + rng.int(-2, 2); });
    return list;
  }
};

/* ═══════════════ MODULE 10: VALIDATOR ═══════════════ */
const Validator = {
  /** @param {*} v @returns {{ok:boolean,error?:string,value?:string}} */
  playerName(v){
    const s = Utils.sanitize(v, 20);
    if (!s) return {ok:false, error:'Name is required'};
    if (s.length < 2) return {ok:false, error:'Name must be at least 2 characters'};
    if (!/^[\w .\-]+$/u.test(s)) return {ok:false, error:'Use letters, numbers, spaces, . or - only'};
    return {ok:true, value:s};
  },
  email(v){
    const s = Utils.sanitize(v, 64);
    if (!s) return {ok:false, error:'Email is required'};
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s)) return {ok:false, error:'Enter a valid email address'};
    return {ok:true, value:s};
  },
  password(v){
    const s = String(v ?? '');
    if (s.length < 6) return {ok:false, error:'Minimum 6 characters'};
    return {ok:true, value:s};
  },
  /** @param {string} pw @returns {{score:number,label:string,color:string}} */
  passwordStrength(pw){
    const s = String(pw ?? '');
    let score = 0;
    if (s.length >= 6) score++;
    if (s.length >= 10) score++;
    if (/[A-Z]/.test(s) && /[a-z]/.test(s)) score++;
    if (/\d/.test(s)) score++;
    if (/[^\w]/.test(s)) score++;
    const map = [
      {label:'Very weak', color:'var(--danger)'}, {label:'Weak', color:'var(--danger)'},
      {label:'Fair', color:'var(--warning)'}, {label:'Good', color:'var(--info)'},
      {label:'Strong', color:'var(--success)'}, {label:'Excellent', color:'var(--success)'}
    ];
    return Object.assign({score}, map[score]);
  },
  bio(v){ return {ok:true, value: Utils.sanitize(v, 160)}; },
  /** Validate a match record before it is written to storage. */
  match(m){
    if (!m || typeof m !== 'object') return {ok:false, error:'Not an object'};
    if (typeof m.id !== 'string' || !m.id) return {ok:false, error:'Missing id'};
    if (!['win','loss','draw'].includes(m.result)) return {ok:false, error:'Invalid result'};
    if (!Number.isFinite(m.createdAt)) return {ok:false, error:'Invalid timestamp'};
    if (!Number.isFinite(m.playerScore) || m.playerScore < 0) return {ok:false, error:'Invalid score'};
    return {ok:true, value:m};
  },
  /** Rate-limit guard shared by every user-triggered action. @returns {boolean} allowed */
  rateLimit(){
    const now = Date.now();
    State.actionTimestamps = State.actionTimestamps.filter(t => now - t < 60000);
    if (State.actionTimestamps.length >= CONFIG.security.maxActionsPerMin){
      Logger.warn('rate limit hit'); return false;
    }
    State.actionTimestamps.push(now);
    return true;
  }
};

/* ═══════════════ MODULE 11: REPOSITORY ═══════════════ */
const Repository = {
  /* ── localStorage mirror ──────────────────────────────────────────────
     Synthetic history is deterministic and can always be regenerated from the
     seed, but matches the user actually played must survive a reload even when
     IndexedDB is unavailable (the file:// case). Only live matches are mirrored,
     newest first, capped so the 5 MB localStorage budget is never threatened. */
  MIRROR_KEY:'rps_live_matches', MIRROR_MAX:200,

  /** @returns {{matches:Object[],rounds:Object[]}} */
  readMirror(){
    const m = StorageManager.get(this.MIRROR_KEY, null);
    if (!m || !Array.isArray(m.matches)) return {matches:[], rounds:[]};
    return {matches: m.matches, rounds: Array.isArray(m.rounds) ? m.rounds : []};
  },
  writeMirror(){
    const live = State.matches.filter(m => !m.synthetic).slice(0, this.MIRROR_MAX);
    const ids = new Set(live.map(m => m.id));
    const rounds = State.rounds.filter(r => ids.has(r.matchId));
    StorageManager.set(this.MIRROR_KEY, {matches: live, rounds});
  },
  /** Merge mirrored live matches into memory without creating duplicates. */
  mergeMirror(){
    const {matches, rounds} = this.readMirror();
    if (!matches.length) return 0;
    const known = new Set(State.matches.map(m => m.id));
    const fresh = matches.filter(m => !known.has(m.id));
    if (fresh.length){
      State.matches = fresh.concat(State.matches).sort((a,b) => b.createdAt - a.createdAt);
      const knownRounds = new Set(State.rounds.map(r => r.id));
      State.rounds = rounds.filter(r => !knownRounds.has(r.id)).concat(State.rounds)
        .sort((a,b) => b.timestamp - a.timestamp);
      Logger.info('restored', fresh.length, 'live matches from the localStorage mirror');
    }
    return fresh.length;
  },

  /** Load hot data from IndexedDB into memory. @returns {Promise<void>} */
  async hydrate(){
    const [matches, rounds, players] = await Promise.all([
      StorageManager.getAll('matches'),
      StorageManager.getAll('rounds'),
      StorageManager.getAll('players')
    ]);
    State.matches = matches.sort((a,b) => b.createdAt - a.createdAt);
    State.rounds = rounds.sort((a,b) => b.timestamp - a.timestamp);
    State.leaderboard = players.sort((a,b) => b.score - a.score);
    Logger.info('hydrated', State.matches.length, 'matches /', State.rounds.length, 'rounds');
  },
  /** Persist a completed match plus its rounds. @param {Object} match @param {Object[]} rounds */
  async saveMatch(match, rounds){
    const v = Validator.match(match);
    if (!v.ok){ Logger.warn('refusing to save invalid match:', v.error); return false; }
    try {
      await StorageManager.put('matches', match);
      await StorageManager.putAll('rounds', rounds);
      State.matches.unshift(match);
      rounds.forEach(r => State.rounds.unshift(r));
      this.writeMirror();
      EventBus.emit('data:updated', {id: match.id, type:'match'});
      return true;
    } catch(err){ Logger.error('saveMatch failed', err); return false; }
  },
  /** @param {string} id @returns {Promise<boolean>} */
  async deleteMatch(id){
    try {
      const match = State.matches.find(m => m.id === id);
      const kids = State.rounds.filter(r => r.matchId === id);
      if (match) UndoManager.push({label:'Delete match ' + id, undo: async () => {
        await StorageManager.put('matches', match);
        await StorageManager.putAll('rounds', kids);
        State.matches.unshift(match); kids.forEach(r => State.rounds.unshift(r));
        this.writeMirror();
        EventBus.emit('data:updated', {id, type:'restore'});
      }});
      await StorageManager.del('matches', id);
      for (const r of kids) await StorageManager.del('rounds', r.id);
      State.matches = State.matches.filter(m => m.id !== id);
      State.rounds = State.rounds.filter(r => r.matchId !== id);
      this.writeMirror();
      EventBus.emit('data:deleted', {id});
      return true;
    } catch(err){ Logger.error('deleteMatch failed', err); return false; }
  },
  /** @param {string[]} ids @returns {Promise<number>} deleted count */
  async deleteMatches(ids){
    let n = 0;
    for (const id of ids){ if (await this.deleteMatch(id)) n++; }
    return n;
  },
  /** Filter + sort + paginate the match log.
   * @param {Object} q @returns {{rows:Object[],total:number,pages:number}} */
  query(q){
    const o = Object.assign({search:'', result:'all', difficulty:'all', mode:'all',
      from:null, to:null, sort:'createdAt', dir:'desc', page:1,
      pageSize:State.config.pageSize}, q || {});
    let rows = State.matches.slice();

    if (o.result !== 'all') rows = rows.filter(r => r.result === o.result);
    if (o.difficulty !== 'all') rows = rows.filter(r => r.difficulty === o.difficulty);
    if (o.mode !== 'all') rows = rows.filter(r => r.mode === o.mode);
    if (o.from) rows = rows.filter(r => r.createdAt >= o.from);
    if (o.to) rows = rows.filter(r => r.createdAt <= o.to);
    if (o.search){
      const s = o.search.toLowerCase();
      rows = rows.filter(r =>
        r.id.toLowerCase().includes(s) || r.difficulty.includes(s) ||
        r.mode.includes(s) || r.result.includes(s));
    }
    const dir = o.dir === 'asc' ? 1 : -1;
    rows.sort((a,b) => {
      const av = a[o.sort], bv = b[o.sort];
      if (typeof av === 'string') return av.localeCompare(String(bv)) * dir;
      return ((Number(av)||0) - (Number(bv)||0)) * dir;
    });
    const total = rows.length;
    const pages = Math.max(1, Math.ceil(total / o.pageSize));
    const page = Utils.clamp(o.page, 1, pages);
    return {rows: rows.slice((page-1)*o.pageSize, page*o.pageSize), total, pages, page};
  },
  /** @param {string} matchId @returns {Object[]} */
  roundsOf(matchId){
    return State.rounds.filter(r => r.matchId === matchId).sort((a,b) => a.round - b.round);
  },
  /** Purge records older than the retention window. @returns {Promise<number>} */
  async applyRetention(){
    const cutoff = Date.now() - State.config.retentionDays * 86400000;
    const stale = State.matches.filter(m => m.createdAt < cutoff).map(m => m.id);
    if (!stale.length) return 0;
    await this.deleteMatches(stale);
    Logger.info('retention purge removed', stale.length, 'matches');
    return stale.length;
  },
  /** Append to the tamper-evident audit trail. @param {string} action @param {Object} [detail] */
  async audit(action, detail){
    const rec = {id: Utils.uuid(), action, detail: detail || {}, timestamp: Date.now(),
                 user: State.user?.name || 'guest'};
    try { await StorageManager.put('audit', rec); } catch(_){}
    return rec;
  },
  async auditLog(){
    const rows = await StorageManager.getAll('audit');
    return rows.sort((a,b) => b.timestamp - a.timestamp).slice(0, 200);
  }
};

/* ═══════════════ MODULE 12: GAME RULES ═══════════════ */
const GameRules = {
  /** @param {string} a player move @param {string} b AI move @returns {'win'|'loss'|'draw'} */
  judge(a, b){
    if (a === b) return 'draw';
    return CONFIG.game.beats[a] === b ? 'win' : 'loss';
  },
  /** @param {string} move @returns {string} the move that beats it */
  counter(move){
    for (const k of CONFIG.game.moves) if (CONFIG.game.beats[k] === move) return k;
    return CONFIG.game.moves[0];
  },
  /** @param {string} move @returns {string} the move it beats */
  loses(move){ return CONFIG.game.beats[move]; },
  /** @param {string} move @returns {boolean} */
  isValid(move){ return CONFIG.game.moves.includes(move); },
  /** @param {string} move @param {Object} [opts] @returns {SVGElement} the hand mark */
  mark(move, opts){ return Icons.svg(this.isValid(move) ? move : 'help', opts); },
  label(move){ return Utils.t(move); }
};

/* ═══════════════ MODULE 13: FEATURE ENGINEER ═══════════════ */
const FeatureEngineer = {
  /** Derive behavioural features from a player's move sequence.
   * @param {Object[]} rounds newest-last @returns {Object} */
  extract(rounds){
    const MOVES = CONFIG.game.moves;
    const counts = {rock:0, paper:0, scissors:0};
    let winStay = 0, winTotal = 0, loseShift = 0, loseTotal = 0, cycles = 0, repeats = 0;
    for (let i = 0; i < rounds.length; i++){
      const r = rounds[i];
      if (counts[r.playerMove] !== undefined) counts[r.playerMove]++;
      if (i > 0){
        const prev = rounds[i-1];
        if (prev.outcome === 'win'){ winTotal++; if (r.playerMove === prev.playerMove) winStay++; }
        if (prev.outcome === 'loss'){ loseTotal++; if (r.playerMove !== prev.playerMove) loseShift++; }
        if (r.playerMove === prev.playerMove) repeats++;
        if (MOVES[(MOVES.indexOf(prev.playerMove)+1)%3] === r.playerMove) cycles++;
      }
    }
    const n = rounds.length || 1;
    const dist = MOVES.map(m => counts[m] / n);
    return {
      samples: rounds.length,
      distribution: dist,
      counts,
      entropy: Utils.entropy(MOVES.map(m => counts[m])),
      winStayRate: winTotal ? winStay / winTotal : 0,
      loseShiftRate: loseTotal ? loseShift / loseTotal : 0,
      repeatRate: rounds.length > 1 ? repeats / (rounds.length - 1) : 0,
      cycleRate: rounds.length > 1 ? cycles / (rounds.length - 1) : 0,
      favourite: MOVES[dist.indexOf(Math.max.apply(null, dist))],
      predictability: Number((1 - Utils.entropy(MOVES.map(m => counts[m]))).toFixed(4))
    };
  },
  /** Human-readable importance of each behavioural signal for the UI. */
  importance(f){
    return [
      {name:'Move bias',      value: Number((1 - f.entropy).toFixed(4))},
      {name:'Win-stay',       value: Number(Math.abs(f.winStayRate - 0.333).toFixed(4))},
      {name:'Lose-shift',     value: Number(Math.abs(f.loseShiftRate - 0.5).toFixed(4))},
      {name:'Cycling',        value: Number(Math.abs(f.cycleRate - 0.333).toFixed(4))},
      {name:'Repetition',     value: Number(Math.abs(f.repeatRate - 0.333).toFixed(4))},
      {name:'Sample depth',   value: Number(Math.min(1, f.samples / 40).toFixed(4))}
    ].sort((a,b) => b.value - a.value);
  }
};

/* ═══════════════ MODULE 14: ML / AI ENGINE ═══════════════ */
/**
 * Ensemble opponent. Four predictors vote on the player's next move; each
 * predictor's vote is scaled by an online-learned reliability weight, so the AI
 * measurably adapts to a specific opponent within ~10 rounds.
 */
const MLEngine = {
  model: null,

  /** @returns {Object} an empty model */
  blank(){
    const MOVES = CONFIG.game.moves;
    const zero3 = () => ({rock:CONFIG.ml.laplace, paper:CONFIG.ml.laplace, scissors:CONFIG.ml.laplace});
    return {
      version: 1, createdAt: Date.now(), updatedAt: Date.now(),
      frequency: zero3(),
      order1: MOVES.reduce((a,m) => (a[m] = zero3(), a), {}),
      order2: {},                       // "rock|paper" → dist
      order3: {},                       // "rock|paper|scissors" → dist
      outcomeCond: {win:zero3(), loss:zero3(), draw:zero3()},
      weights: {order1:1, order2:1, order3:1, frequency:1, outcome:1},
      hits: {order1:0, order2:0, order3:0, frequency:0, outcome:0},
      attempts: {order1:0, order2:0, order3:0, frequency:0, outcome:0},
      totalRounds: 0, correct: 0
    };
  },

  /** Load the persisted model or start fresh. */
  init(){
    const saved = StorageManager.get(LS.model, null);
    this.model = (saved && saved.version === 1) ? saved : this.blank();
    State.model = this.model;
    Logger.info('AI model ready —', this.model.totalRounds, 'rounds of memory');
    return this.model;
  },

  save(){
    this.model.updatedAt = Date.now();
    StorageManager.set(LS.model, this.model);
  },

  reset(){
    this.model = this.blank();
    State.model = this.model;
    this.save();
    EventBus.emit('ml:reset');
  },

  /** Normalise a count-distribution to probabilities. @param {Object} d @returns {Object} */
  norm(d){
    const total = CONFIG.game.moves.reduce((s,m) => s + (d[m] || 0), 0) || 1;
    const out = {};
    for (const m of CONFIG.game.moves) out[m] = (d[m] || 0) / total;
    return out;
  },

  /** @param {Object[]} hist newest-last round history @returns {Object} per-predictor votes */
  votes(hist){
    const M = this.model, MOVES = CONFIG.game.moves;
    const uniform = {rock:1/3, paper:1/3, scissors:1/3};
    const out = {};

    out.frequency = {dist: this.norm(M.frequency), label:'Frequency'};

    const last1 = hist.length >= 1 ? hist[hist.length-1].playerMove : null;
    out.order1 = {dist: last1 && M.order1[last1] ? this.norm(M.order1[last1]) : uniform,
                  label:'Markov-1'};

    const k2 = hist.length >= 2
      ? hist[hist.length-2].playerMove + '|' + hist[hist.length-1].playerMove : null;
    out.order2 = {dist: k2 && M.order2[k2] ? this.norm(M.order2[k2]) : uniform, label:'Markov-2'};

    const k3 = hist.length >= 3
      ? hist.slice(-3).map(r => r.playerMove).join('|') : null;
    out.order3 = {dist: k3 && M.order3[k3] ? this.norm(M.order3[k3]) : uniform, label:'Markov-3'};

    const lastOutcome = hist.length >= 1 ? hist[hist.length-1].outcome : null;
    out.outcome = {dist: lastOutcome && M.outcomeCond[lastOutcome]
      ? this.norm(M.outcomeCond[lastOutcome]) : uniform, label:'Win-stay/Lose-shift'};

    return out;
  },

  /** Blend predictor votes using learned reliabilities.
   * @param {Object[]} hist @returns {{move:string,probs:Object,confidence:number,votes:Object,top:string}} */
  predict(hist){
    const M = this.model;
    const v = this.votes(hist);
    const staticW = {
      order1: CONFIG.ml.markovOrder1Weight, order2: CONFIG.ml.markovOrder2Weight,
      order3: CONFIG.ml.markovOrder3Weight, frequency: CONFIG.ml.frequencyWeight,
      outcome: CONFIG.ml.winStayWeight
    };
    const blended = {rock:0, paper:0, scissors:0};
    let wSum = 0;
    const detail = [];
    for (const key of Object.keys(v)){
      // Reliability = smoothed historical hit-rate of this predictor.
      const att = M.attempts[key] || 0, hit = M.hits[key] || 0;
      const reliability = (hit + 1) / (att + 3);          // Laplace-smoothed
      const w = staticW[key] * (0.5 + reliability * 1.5) * (M.weights[key] || 1);
      wSum += w;
      for (const m of CONFIG.game.moves) blended[m] += v[key].dist[m] * w;
      const best = CONFIG.game.moves.reduce((a,b) => v[key].dist[a] >= v[key].dist[b] ? a : b);
      detail.push({key, label: v[key].label, predicts: best,
                   p: Number(v[key].dist[best].toFixed(3)),
                   reliability: Number(reliability.toFixed(3)),
                   weight: Number(w.toFixed(3))});
    }
    for (const m of CONFIG.game.moves) blended[m] /= (wSum || 1);

    const top = CONFIG.game.moves.reduce((a,b) => blended[a] >= blended[b] ? a : b);
    const sorted = CONFIG.game.moves.map(m => blended[m]).sort((a,b) => b - a);
    // Confidence = margin between the best and second-best prediction, rescaled.
    const margin = sorted[0] - sorted[1];
    const depth = Math.min(1, hist.length / CONFIG.ml.minSamplesForConfidence);
    const confidence = Utils.clamp(CONFIG.ml.confidenceFloor + margin * 1.8 * depth, 0, 0.99);

    return {move: top, probs: blended, confidence, votes: detail, top,
            detail: detail.sort((a,b) => b.weight - a.weight)};
  },

  /** Choose the AI's actual throw for a difficulty tier.
   * @param {string} difficulty @param {Object[]} hist
   * @returns {{move:string,prediction:?Object,reason:string}} */
  chooseMove(difficulty, hist){
    const rnd = () => CONFIG.game.moves[Math.floor(Math.random()*3)];

    if (difficulty === 'easy'){
      const m = rnd();
      return {move:m, prediction:null,
              reason:'EASY — uniform random throw (no modelling). P(each)=33.3%'};
    }

    if (difficulty === 'medium'){
      // Pure frequency analysis over the whole observed history.
      const dist = this.norm(this.model.frequency);
      const fav = CONFIG.game.moves.reduce((a,b) => dist[a] >= dist[b] ? a : b);
      const conf = dist[fav];
      if (this.model.totalRounds < 3 || conf < 0.38){
        const m = rnd();
        return {move:m, prediction:null,
                reason:'MEDIUM — only ' + this.model.totalRounds + ' samples and no clear bias yet, ' +
                       'so throwing randomly. Favourite so far: ' + fav + ' (' + Utils.pct(conf) + ').'};
      }
      return {move: GameRules.counter(fav), prediction:{move:fav, confidence:conf},
              reason:'MEDIUM — frequency analysis says you favour ' + fav + ' (' + Utils.pct(conf) +
                     ' of throws). Countering with ' + GameRules.counter(fav) + '.'};
    }

    if (difficulty === 'hard'){
      // Markov chain of order 2, falling back to order 1 then frequency.
      const p = this.predict(hist);
      const best = p.detail.find(d => d.key === 'order2' && d.p > 0.4)
                || p.detail.find(d => d.key === 'order1' && d.p > 0.4);
      const target = best ? best.predicts : p.move;
      return {move: GameRules.counter(target),
              prediction:{move:target, confidence: best ? best.p : p.confidence},
              reason:'HARD — ' + (best ? best.label : 'blended chain') + ' predicts you play ' +
                     target + ' (' + Utils.pct(best ? best.p : p.confidence) + '). Countering with ' +
                     GameRules.counter(target) + '.'};
    }

    // Adaptive: full weighted ensemble, with deliberate noise when the read is weak
    // so a human cannot simply invert a deterministic AI.
    const p = this.predict(hist);
    if (p.confidence < CONFIG.ml.confidenceFloor + 0.06 || hist.length < 2){
      const m = rnd();
      return {move:m, prediction:p,
              reason:'ADAPTIVE — ensemble confidence is only ' + Utils.pct(p.confidence) +
                     ', below the acting threshold. Throwing randomly to stay unreadable.'};
    }
    // 12% exploration keeps the AI from becoming predictable itself.
    if (Math.random() < 0.12){
      const m = rnd();
      return {move:m, prediction:p,
              reason:'ADAPTIVE — exploration throw (12% of rounds) to avoid becoming ' +
                     'predictable. Model wanted ' + GameRules.counter(p.move) + '.'};
    }
    const top2 = p.detail.slice(0,2).map(d => d.label + '→' + d.predicts +
                 ' (r=' + d.reliability + ')').join(', ');
    return {move: GameRules.counter(p.move), prediction:p,
            reason:'ADAPTIVE — ensemble predicts ' + p.move + ' at ' + Utils.pct(p.confidence) +
                   ' confidence. Leading voters: ' + top2 + '. Countering with ' +
                   GameRules.counter(p.move) + '.'};
  },

  /** Learn from a completed round.
   * @param {Object[]} histBefore rounds prior to this one
   * @param {string} actualMove @param {string} outcome */
  learn(histBefore, actualMove, outcome){
    const M = this.model;
    if (!GameRules.isValid(actualMove)) return;

    // Credit/blame each predictor for the round that just resolved.
    const v = this.votes(histBefore);
    for (const key of Object.keys(v)){
      const dist = v[key].dist;
      const guess = CONFIG.game.moves.reduce((a,b) => dist[a] >= dist[b] ? a : b);
      M.attempts[key] = (M.attempts[key] || 0) + 1;
      if (guess === actualMove) M.hits[key] = (M.hits[key] || 0) + 1;
      // Multiplicative-weights update: reward accuracy, decay error.
      const w = M.weights[key] || 1;
      M.weights[key] = Utils.clamp(guess === actualMove ? w * 1.06 : w * 0.96, 0.35, 3);
    }

    // Exponential decay keeps the model responsive to a change in tactics.
    const decay = CONFIG.ml.decay;
    for (const m of CONFIG.game.moves) M.frequency[m] *= decay;
    M.frequency[actualMove] = (M.frequency[actualMove] || 0) + 1;

    const h = histBefore;
    if (h.length >= 1){
      const k = h[h.length-1].playerMove;
      M.order1[k] = M.order1[k] || {rock:CONFIG.ml.laplace,paper:CONFIG.ml.laplace,scissors:CONFIG.ml.laplace};
      for (const m of CONFIG.game.moves) M.order1[k][m] *= decay;
      M.order1[k][actualMove] += 1;

      const o = h[h.length-1].outcome;
      if (M.outcomeCond[o]){
        for (const m of CONFIG.game.moves) M.outcomeCond[o][m] *= decay;
        M.outcomeCond[o][actualMove] += 1;
      }
    }
    if (h.length >= 2){
      const k2 = h[h.length-2].playerMove + '|' + h[h.length-1].playerMove;
      M.order2[k2] = M.order2[k2] || {rock:CONFIG.ml.laplace,paper:CONFIG.ml.laplace,scissors:CONFIG.ml.laplace};
      M.order2[k2][actualMove] += 1;
    }
    if (h.length >= 3){
      const k3 = h.slice(-3).map(r => r.playerMove).join('|');
      M.order3[k3] = M.order3[k3] || {rock:CONFIG.ml.laplace,paper:CONFIG.ml.laplace,scissors:CONFIG.ml.laplace};
      M.order3[k3][actualMove] += 1;
    }

    M.totalRounds++;
    this.save();
  },

  /** Overall predictor accuracy for the analytics page. @returns {number} 0..1 */
  accuracy(){
    const M = this.model;
    if (!M) return 0;
    const att = M.attempts.order2 || 0;
    return att ? (M.hits.order2 || 0) / att : 0;
  },

  /** Per-predictor scorecard for the model-comparison chart. @returns {Object[]} */
  scorecard(){
    const M = this.model;
    if (!M) return [];
    return Object.keys(M.attempts).map(k => ({
      model: k,
      attempts: M.attempts[k] || 0,
      hits: M.hits[k] || 0,
      accuracy: M.attempts[k] ? (M.hits[k] || 0) / M.attempts[k] : 0,
      weight: Number((M.weights[k] || 1).toFixed(3))
    })).sort((a,b) => b.accuracy - a.accuracy);
  },

  /** 3×3 transition matrix (previous move → next move) from the full round log. */
  transitionMatrix(rounds){
    const MOVES = CONFIG.game.moves;
    const grid = MOVES.map(() => MOVES.map(() => 0));
    const byMatch = {};
    rounds.forEach(r => { (byMatch[r.matchId] = byMatch[r.matchId] || []).push(r); });
    Object.values(byMatch).forEach(list => {
      list.sort((a,b) => a.round - b.round);
      for (let i = 1; i < list.length; i++){
        const a = MOVES.indexOf(list[i-1].playerMove), b = MOVES.indexOf(list[i].playerMove);
        if (a >= 0 && b >= 0) grid[a][b]++;
      }
    });
    return grid.map(row => {
      const t = Utils.sum(row) || 1;
      return row.map(c => Number((c/t).toFixed(4)));
    });
  }
};

/* ═══════════════ MODULE 15: STATS ENGINE ═══════════════ */
const StatsEngine = {
  /** Recompute every aggregate from the match/round log. @returns {Object} */
  compute(){
    const matches = State.matches, rounds = State.rounds;
    const played = matches.length;
    const wins = matches.filter(m => m.result === 'win').length;
    const losses = matches.filter(m => m.result === 'loss').length;
    const draws = played - wins - losses;

    const rWins = rounds.filter(r => r.outcome === 'win').length;
    const rLosses = rounds.filter(r => r.outcome === 'loss').length;
    const rDraws = rounds.length - rWins - rLosses;

    // Streaks are computed over rounds in chronological order.
    const chrono = rounds.slice().sort((a,b) => a.timestamp - b.timestamp);
    let cur = 0, best = 0, bestAt = null, curLossStreak = 0, worstLoss = 0;
    chrono.forEach(r => {
      if (r.outcome === 'win'){ cur++; curLossStreak = 0; if (cur > best){ best = cur; bestAt = r.timestamp; } }
      else if (r.outcome === 'loss'){ cur = 0; curLossStreak++; worstLoss = Math.max(worstLoss, curLossStreak); }
    });

    const sessionMatches = matches.filter(m => !m.synthetic);
    const period = days => {
      const cut = Date.now() - days * 86400000;
      const sub = rounds.filter(r => r.timestamp >= cut);
      const w = sub.filter(r => r.outcome === 'win').length;
      return {rounds: sub.length, wins: w, winRate: sub.length ? w/sub.length : 0};
    };

    const moveCounts = {rock:0, paper:0, scissors:0};
    rounds.forEach(r => { if (moveCounts[r.playerMove] !== undefined) moveCounts[r.playerMove]++; });

    const feats = FeatureEngineer.extract(chrono.slice(-200));

    const stats = {
      matches: played, wins, losses, draws,
      winRate: played ? wins/played : 0,
      rounds: rounds.length, roundWins: rWins, roundLosses: rLosses, roundDraws: rDraws,
      roundWinRate: rounds.length ? rWins/rounds.length : 0,
      currentStreak: cur, bestStreak: best, bestStreakAt: bestAt, worstLossStreak: worstLoss,
      sessionMatches: sessionMatches.length,
      sessionWins: sessionMatches.filter(m => m.result === 'win').length,
      moveCounts, favouriteMove: feats.favourite,
      predictability: feats.predictability, entropy: feats.entropy,
      winStayRate: feats.winStayRate, loseShiftRate: feats.loseShiftRate,
      cycleRate: feats.cycleRate, repeatRate: feats.repeatRate,
      avgResponseMs: Math.round(Utils.mean(rounds.slice(0,300).map(r => r.responseMs || 0))),
      aiAccuracy: MLEngine.accuracy(),
      last7: period(7), last30: period(30), last90: period(90),
      totalPlayTimeMs: Utils.sum(matches.map(m => m.durationMs || 0)),
      computedAt: Date.now()
    };
    // Trend: is the player improving? Compare last 7 days against the prior 23.
    const prior = (() => {
      const from = Date.now() - 30*86400000, to = Date.now() - 7*86400000;
      const sub = rounds.filter(r => r.timestamp >= from && r.timestamp < to);
      const w = sub.filter(r => r.outcome === 'win').length;
      return sub.length ? w/sub.length : 0;
    })();
    stats.trend = stats.last7.rounds ? stats.last7.winRate - prior : 0;

    State.stats = stats;
    StorageManager.set(LS.stats, stats);
    return stats;
  },
  /** Daily win-rate series for the trend charts. @param {number} days @returns {Object} */
  series(days){
    const out = [], now = new Date(); now.setHours(23,59,59,999);
    const buckets = new Map();
    State.rounds.forEach(r => {
      const key = new Date(r.timestamp).toISOString().slice(0,10);
      const b = buckets.get(key) || {w:0,l:0,d:0,n:0};
      b.n++; if (r.outcome === 'win') b.w++; else if (r.outcome === 'loss') b.l++; else b.d++;
      buckets.set(key, b);
    });
    for (let i = days - 1; i >= 0; i--){
      const d = new Date(now.getTime() - i * 86400000);
      const key = d.toISOString().slice(0,10);
      const b = buckets.get(key) || {w:0,l:0,d:0,n:0};
      out.push({date:key, label: Utils.date(d), wins:b.w, losses:b.l, draws:b.d,
                rounds:b.n, winRate: b.n ? b.w/b.n : null});
    }
    return {labels: out.map(o => o.label), points: out};
  },
  /** Sparkline values for a KPI card. @param {string} metric @returns {number[]} */
  spark(metric){
    const s = this.series(CONFIG.ui.sparkPoints);
    return s.points.map(p => {
      if (metric === 'winRate') return Number(((p.winRate ?? 0) * 100).toFixed(1));
      if (metric === 'rounds') return p.rounds;
      if (metric === 'wins') return p.wins;
      return p.losses;
    });
  }
};
